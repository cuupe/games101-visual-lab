<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>齐次除法</title><desc>矩阵保存齐次形式，最后除以 w 才得到二维比例。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="42" y="25" width="276" height="51" rx="5" fill="#142235" stroke="#b9a2ff"/><text x="180" y="57" fill="#b9a2ff" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">裁剪坐标 x=2，y=1，w=4</text><line x1="180" y1="82" x2="180" y2="115" stroke="#f3b47f" stroke-width="2.7"/><polygon points="180,115 176,106.94 184,106.94" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><rect x="80" y="126" width="200" height="96" rx="0" fill="#142235" stroke="#2a3d55"/><line x1="80" y1="174" x2="280" y2="174" stroke="#9bb0ca" stroke-width="1"/><line x1="180" y1="126" x2="180" y2="222" stroke="#9bb0ca" stroke-width="1"/><circle cx="230" cy="162" r="4" fill="#82dfbd" stroke="none" stroke-width="2"/><text x="238" y="153" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">(0.5,0.25)</text><text x="180" y="248" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">除以 w：x=2/4，y=1/4</text></svg>