<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>收光圈，延长快门</title><desc>光圈 f/4、快门 1/50 s 的相对光量约 0.98；运动积分时间加倍。</desc><rect width="360" height="264" fill="#0b1421"/><text x="25" y="25" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">f/4 · 1/50 s · ISO 100</text><text x="25" y="63" fill="#9bb0ca" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">光子收集</text><rect x="125" y="44" width="147" height="26" rx="0" fill="#82dfbd" stroke="none"/><text x="25" y="110" fill="#9bb0ca" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">输出增益</text><rect x="125" y="91" width="75" height="26" rx="0" fill="#b9a2ff" stroke="none"/><text x="25" y="151" fill="#9bb0ca" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">物体投影速度 100 px/s</text><line x1="55" y1="184" x2="195" y2="184" stroke="#f3b47f" stroke-width="15"/><circle cx="55" cy="184" r="6" fill="#e0eaf7" stroke="none" stroke-width="2"/><text x="55" y="218" fill="#f3b47f" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">轨迹长度 2 px</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">光量约相同；轨迹 2 px</text></svg>