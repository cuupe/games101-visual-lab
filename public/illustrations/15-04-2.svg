<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>自发光也能直接贡献</title><desc>渲染方程同时包含自发光和反射；普通不发光表面的 Lₑ 为零。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="44" y="97" width="273" height="76" rx="8" fill="#142235" stroke="#83baff"/><text x="64" y="129" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">Lₒ = Lₑ + Lᵣ</text><line x1="77" y1="90" x2="77" y2="52" stroke="#f3b47f" stroke-width="2.7"/><polygon points="77,52 81,60.06 73,60.06" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="241" y1="90" x2="282" y2="49" stroke="#82dfbd" stroke-width="2.7"/><polygon points="282,49 279.12,57.53 273.47,51.88" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="45" y="203" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">自发光</text><text x="235" y="203" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">反射</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">二者属于不同来源，可逐项调试</text></svg>