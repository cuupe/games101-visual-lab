<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>折射率决定正入射 F₀</title><desc>空气进入 n=1.3、1.5、2 的理想无吸收介质，反射率不同。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="61" y="190.75" width="79.33" height="2.25" rx="0" fill="#83baff" stroke="none"/><rect x="144.33" y="187.72" width="79.33" height="5.28" rx="0" fill="#b9a2ff" stroke="none"/><rect x="227.67" y="178.33" width="79.33" height="14.67" rx="0" fill="#f3b47f" stroke="none"/><line x1="59" y1="193" x2="309" y2="193" stroke="#9bb0ca" stroke-width="1.4"/><text x="55" y="222" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">n=1.3</text><text x="139" y="222" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">1.5</text><text x="236" y="222" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">2</text><text x="47" y="49" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">F₀=((1−n)/(1+n))²</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">约 1.7%、4.0%、11.1%</text></svg>