<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>偏移过大跳过薄几何</title><desc>绿色新起点越过了上方薄片，导致漏掉本该命中的物体。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="28" y1="197" x2="332" y2="197" stroke="#83baff" stroke-width="4"/><rect x="80" y="144" width="197" height="7" rx="0" fill="#b9a2ff" stroke="none"/><circle cx="170" cy="197" r="4" fill="#83baff" stroke="none" stroke-width="2"/><text x="177" y="189" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">p</text><line x1="170" y1="197" x2="170" y2="91" stroke="#82dfbd" stroke-width="2.7"/><polygon points="170,91 174,99.06 166,99.06" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><circle cx="170" cy="125" r="5" fill="#82dfbd" stroke="none" stroke-width="2"/><text x="192" y="128" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">偏移后</text><text x="185" y="177" fill="#b9a2ff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">薄片</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">ε 要配合尺度，不能一味增大</text></svg>