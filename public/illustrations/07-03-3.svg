<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>另一次可见性查询</title><desc>先沿光源路径检查遮挡，只有光源可见时才加入对应直接光照贡献。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="45" y1="192" x2="315" y2="192" stroke="#9bb0ca" stroke-width="3"/><circle cx="168" cy="192" r="5" fill="#e0eaf7" stroke="none" stroke-width="2"/><line x1="168" y1="192" x2="168" y2="75" stroke="#83baff" stroke-width="2.7"/><polygon points="168,75 172,83.06 164,83.06" fill="#83baff" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="152" y="68" fill="#83baff" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">n</text><line x1="168" y1="192" x2="276" y2="78" stroke="#f3b47f" stroke-width="2.7"/><polygon points="276,78 273.35,86.6 267.55,81.11" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="281" y="75" fill="#f3b47f" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">l</text><line x1="168" y1="192" x2="310" y2="165" stroke="#b9a2ff" stroke-width="2.7"/><polygon points="310,165 302.82,170.43 301.33,162.58" fill="#b9a2ff" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="313" y="155" fill="#b9a2ff" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">v</text><rect x="207" y="116" width="45" height="18" rx="0" fill="#ff8c9f" stroke="none"/><text x="217" y="108" fill="#ff8c9f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">遮挡</text><text x="39" y="32" fill="#ff8c9f" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">可见性 V = 0</text><text x="39" y="56" fill="#ff8c9f" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">直接光：V × L = 0</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">shading 计算颜色，shadow 查询光路</text></svg>