<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>时间混叠：车轮倒转</title><desc>每帧实际向前转 315°，与向后转 45°具有相同的可见朝向。</desc><rect width="360" height="264" fill="#0b1421"/><circle cx="180" cy="127" r="76" fill="none" stroke="#9bb0ca" stroke-width="2"/><line x1="180" y1="127" x2="252" y2="127" stroke="#2a3d55" stroke-width="2"/><line x1="180" y1="127" x2="230.91" y2="177.91" stroke="#2a3d55" stroke-width="2"/><line x1="180" y1="127" x2="180" y2="199" stroke="#2a3d55" stroke-width="2"/><line x1="180" y1="127" x2="129.09" y2="177.91" stroke="#2a3d55" stroke-width="2"/><line x1="180" y1="127" x2="108" y2="127" stroke="#2a3d55" stroke-width="2"/><line x1="180" y1="127" x2="129.09" y2="76.09" stroke="#2a3d55" stroke-width="2"/><line x1="180" y1="127" x2="180" y2="55" stroke="#2a3d55" stroke-width="2"/><line x1="180" y1="127" x2="230.91" y2="76.09" stroke="#2a3d55" stroke-width="2"/><line x1="180" y1="127" x2="252" y2="127" stroke="#82dfbd" stroke-width="4"/><polygon points="252,127 243.94,131 243.94,123" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="180" y1="127" x2="231" y2="76" stroke="#f3b47f" stroke-width="4"/><polygon points="231,76 228.12,84.53 222.47,78.88" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M 273 124 A 93 93 0 1 1 246 61" fill="none" stroke="#82dfbd" stroke-width="2" stroke-dasharray="5 4"/><text x="26" y="33" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">前进 315° ≡ 后退 45°</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">时间采样也会丢失旋转方向</text></svg>