<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>射线对准同一焦点</title><desc>三种孔径起点都指向场景侧对焦点；前后深度截面仍产生不同交点。</desc><rect width="360" height="264" fill="#0b1421"/><text x="20" y="25" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">镜头采样 → 场景对焦点</text><line x1="65" y1="65" x2="65" y2="208" stroke="#83baff" stroke-width="4"/><line x1="260" y1="55" x2="260" y2="214" stroke="#b9a2ff" stroke-width="2"/><line x1="155" y1="55" x2="155" y2="214" stroke="#2a3d55" stroke-width="2" stroke-dasharray="4 4"/><line x1="65" y1="80" x2="260" y2="132" stroke="#82dfbd" stroke-width="2"/><circle cx="65" cy="80" r="4" fill="#f3b47f" stroke="none" stroke-width="2"/><line x1="65" y1="132" x2="260" y2="132" stroke="#82dfbd" stroke-width="2"/><circle cx="65" cy="132" r="4" fill="#f3b47f" stroke="none" stroke-width="2"/><line x1="65" y1="184" x2="260" y2="132" stroke="#82dfbd" stroke-width="2"/><circle cx="65" cy="184" r="4" fill="#f3b47f" stroke="none" stroke-width="2"/><circle cx="260" cy="132" r="6" fill="#f3b47f" stroke="none" stroke-width="2"/><text x="225" y="44" fill="#b9a2ff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">对焦面</text><text x="113" y="44" fill="#9bb0ca" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">前景面</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">焦点会聚；其他深度有视差</text></svg>