<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>BVH：原语分组后求盒</title><desc>两组交叉细长原语各只存一次，但其轴对齐盒大幅重叠。</desc><rect width="360" height="264" fill="#0b1421"/><polygon points="51,69 294,159 64,91" fill="none" stroke="#83baff" stroke-width="2" stroke-linejoin="round"/><polygon points="283,70 57,161 290,90" fill="none" stroke="#b9a2ff" stroke-width="2" stroke-linejoin="round"/><rect x="48" y="66" width="249" height="96" rx="0" fill="none" stroke="#83baff"/><rect x="54" y="67" width="239" height="97" rx="0" fill="none" stroke="#b9a2ff"/><text x="52" y="196" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">对象 A</text><text x="231" y="196" fill="#b9a2ff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">对象 B</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">对象归属分离，包围盒可重叠</text></svg>