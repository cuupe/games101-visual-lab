<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>盒必须使用对象边界</title><desc>质心小的长物体仍可能伸得很远，不能只包住几个质心。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="31" y="88" width="91" height="106" rx="0" fill="none" stroke="#ff8c9f"/><rect x="31" y="68" width="263" height="126" rx="0" fill="none" stroke="#82dfbd"/><polygon points="35,106 277,121 35,137" fill="#142235" stroke="#f3b47f" stroke-width="2" stroke-linejoin="round"/><circle cx="116" cy="121" r="5" fill="#b9a2ff" stroke="none" stroke-width="2"/><text x="34" y="54" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">真实包围盒</text><text x="124" y="160" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">长物体延伸</text><text x="35" y="221" fill="#ff8c9f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">红盒只包质心：错误</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">父盒包含每个原语的完整边界</text></svg>