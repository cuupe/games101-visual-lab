<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>4 个子样本</title><desc>绿点在三角形内、红点在外；本图 1 个绿点除以 4 个样本。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="75" y="40" width="180" height="180" rx="0" fill="#142235" stroke="#9bb0ca"/><polygon points="75,220 75,40 212,220" fill="#82dfbd55" stroke="#82dfbd" stroke-width="2" stroke-linejoin="round"/><circle cx="120" cy="85" r="7" fill="#ff8c9f" stroke="none" stroke-width="2"/><circle cx="210" cy="85" r="7" fill="#ff8c9f" stroke="none" stroke-width="2"/><circle cx="120" cy="175" r="7" fill="#82dfbd" stroke="none" stroke-width="2"/><circle cx="210" cy="175" r="7" fill="#ff8c9f" stroke="none" stroke-width="2"/><text x="283" y="106" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">绿：内</text><text x="283" y="139" fill="#ff8c9f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">红：外</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">1/4 = 0.25；真实值 ≈ 0.381</text></svg>