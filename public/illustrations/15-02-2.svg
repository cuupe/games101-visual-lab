<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>分母使用投影面积</title><desc>表面倾斜时，垂直于光线的有效面积为实际面积乘余弦。</desc><rect width="360" height="264" fill="#0b1421"/><polygon points="107,66 253,151 230,192 83,107" fill="#142235" stroke="#83baff" stroke-width="2" stroke-linejoin="round"/><line x1="120" y1="33" x2="120" y2="128" stroke="#f3b47f" stroke-width="2.7"/><polygon points="120,128 116,119.94 124,119.94" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="200" y1="33" x2="200" y2="175" stroke="#f3b47f" stroke-width="2.7"/><polygon points="200,175 196,166.94 204,166.94" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="83" y1="107" x2="83" y2="201" stroke="#9bb0ca" stroke-width="1.3" stroke-dasharray="4 4"/><line x1="230" y1="192" x2="230" y2="201" stroke="#9bb0ca" stroke-width="1.3" stroke-dasharray="4 4"/><line x1="83" y1="201" x2="230" y2="201" stroke="#82dfbd" stroke-width="5"/><text x="222" y="113" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">dA</text><text x="91" y="224" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">dA⊥=dA cosθ</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">L：W/(m²·sr)</text></svg>