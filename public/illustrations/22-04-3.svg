<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>大步与两个半步估计误差</title><desc>衰减系统的中点法：一大步 0.2 得 0.82；两步 0.1 得 0.819025。差异约 0.000975。</desc><rect width="360" height="264" fill="#0b1421"/><text x="20" y="25" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">同一总时长 0.2 s</text><text x="25" y="74" fill="#83baff" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">一大步</text><line x1="105" y1="68" x2="270" y2="68" stroke="#83baff" stroke-width="2.7"/><polygon points="270,68 261.94,72 261.94,64" fill="#83baff" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="278" y="74" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">0.82</text><text x="25" y="135" fill="#82dfbd" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">两半步</text><line x1="105" y1="129" x2="177" y2="129" stroke="#82dfbd" stroke-width="2.7"/><polygon points="177,129 168.94,133 168.94,125" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="189" y1="129" x2="270" y2="129" stroke="#82dfbd" stroke-width="2.7"/><polygon points="270,129 261.94,133 261.94,125" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="170" y="164" fill="#9bb0ca" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">0.905</text><text x="220" y="207" fill="#82dfbd" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">0.819025</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">误差估计依赖光滑性和方法阶</text></svg>