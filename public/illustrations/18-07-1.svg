<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>局部反射在同一点发生</title><desc>局部模型只把 p 的入射照明映射到 p 的出射方向，不能自己照亮邻点。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="28" y1="125" x2="332" y2="125" stroke="#83baff" stroke-width="4"/><line x1="74" y1="49" x2="134" y2="125" stroke="#f3b47f" stroke-width="2.7"/><polygon points="134,125 125.87,121.15 132.14,116.19" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="134" y1="125" x2="192" y2="49" stroke="#82dfbd" stroke-width="2.7"/><polygon points="192,49 190.28,57.83 183.93,52.99" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><circle cx="134" cy="125" r="5" fill="#82dfbd" stroke="none" stroke-width="2"/><circle cx="278" cy="125" r="5" fill="#b9a2ff" stroke="none" stroke-width="2"/><text x="135" y="162" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">p</text><text x="278" y="162" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">q</text><text x="211" y="209" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">q 不因此获得光</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">BRDF：入射与出射位置相同</text></svg>