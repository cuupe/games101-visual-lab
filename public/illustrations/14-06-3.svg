<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>等 θ 间隔并非等方向面积</title><desc>等纬向角宽的两条带，在球顶更窄；均匀方向应均匀采样 cosθ。</desc><rect width="360" height="264" fill="#0b1421"/><circle cx="180" cy="131" r="78" fill="#142235" stroke="#83baff" stroke-width="2"/><path d="M 108 99 Q 180 118 252 99" fill="none" stroke="#f3b47f" stroke-width="2.5"/><path d="M 119 80 Q 180 99 241 80" fill="none" stroke="#f3b47f" stroke-width="2.5"/><path d="M 103 127 Q 180 150 257 127" fill="none" stroke="#82dfbd" stroke-width="2.5"/><path d="M 104 149 Q 180 172 256 149" fill="none" stroke="#82dfbd" stroke-width="2.5"/><text x="18" y="70" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">极区小</text><text x="19" y="188" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">赤道大</text><line x1="74" y1="74" x2="130" y2="85" stroke="#f3b47f" stroke-width="2"/><line x1="75" y1="181" x2="126" y2="152" stroke="#82dfbd" stroke-width="2"/><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">dω = sinθ dθ dφ</text></svg>