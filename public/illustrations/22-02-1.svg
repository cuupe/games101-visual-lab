<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>相空间切线走到圆外</title><desc>取 k=1，初值 (x,v)=(1,0)，h=0.5；真实圆轨道与 Euler 下一点 (1,−0.5) 比较。</desc><rect width="360" height="264" fill="#0b1421"/><circle cx="175" cy="126" r="76" fill="none" stroke="#f3b47f" stroke-width="2"/><line x1="65" y1="126" x2="288" y2="126" stroke="#2a3d55" stroke-width="2"/><line x1="175" y1="38" x2="175" y2="214" stroke="#2a3d55" stroke-width="2"/><circle cx="251" cy="126" r="6" fill="#f3b47f" stroke="none" stroke-width="2"/><line x1="251" y1="126" x2="251" y2="164" stroke="#82dfbd" stroke-width="2.7"/><polygon points="251,164 247,155.94 255,155.94" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><circle cx="251" cy="164" r="6" fill="#82dfbd" stroke="none" stroke-width="2"/><text x="20" y="25" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">横轴 x；纵轴 v</text><text x="20" y="225" fill="#9bb0ca" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">离散点半径 √1.25</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">E₁/E₀=1+h²=1.25</text></svg>