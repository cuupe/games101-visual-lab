<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>隐式：代入函数判断符号</title><desc>半径 1 的圆截面以 f=x²+y²−1 表示；中心负、边界零、外部正。</desc><rect width="360" height="264" fill="#0b1421"/><circle cx="180" cy="124" r="77" fill="#82dfbd22" stroke="#82dfbd" stroke-width="2"/><circle cx="180" cy="124" r="4" fill="#82dfbd" stroke="none" stroke-width="2"/><text x="188" y="115" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">f = −1</text><circle cx="257" cy="124" r="4" fill="#83baff" stroke="none" stroke-width="2"/><text x="265" y="115" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">f = 0</text><circle cx="304" cy="60" r="4" fill="#f3b47f" stroke="none" stroke-width="2"/><text x="312" y="51" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">f &gt; 0</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">容易问：这个点在内部吗？</text></svg>