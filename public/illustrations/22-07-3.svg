<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>网格速度再传回 G2P</title><desc>无网格受力时两节点速度 p/m 都等于 3；用相同权重回传得到粒子速度 3。这仅是守恒传输示意。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="40" y="43" width="95" height="45" rx="0" fill="#142235" stroke="#83baff"/><rect x="223" y="43" width="96" height="45" rx="0" fill="#142235" stroke="#82dfbd"/><text x="87" y="73" fill="#83baff" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">v₁=3</text><text x="271" y="73" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">v₂=3</text><line x1="87" y1="102" x2="167" y2="161" stroke="#83baff" stroke-width="2.7"/><polygon points="167,161 158.14,159.43 162.88,153" fill="#83baff" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="271" y1="102" x2="193" y2="161" stroke="#82dfbd" stroke-width="2.7"/><polygon points="193,161 197.02,152.95 201.84,159.32" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><circle cx="180" cy="180" r="15" fill="#f3b47f" stroke="none" stroke-width="2"/><text x="180" y="223" fill="#e0eaf7" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">v=0.25×3+0.75×3=3</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">完整 MPM 还需应力与边界</text></svg>