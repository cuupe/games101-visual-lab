<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>Lab 距离的条件</title><desc>两个示例 Lab 点 (50,20,10) 与 (50,23,14)，欧氏距离为 5；这种近似仍依赖标准观察条件。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="65" y1="190" x2="300" y2="190" stroke="#9bb0ca" stroke-width="2"/><line x1="65" y1="190" x2="65" y2="55" stroke="#9bb0ca" stroke-width="2"/><circle cx="125" cy="145" r="7" fill="#82dfbd" stroke="none" stroke-width="2"/><circle cx="215" cy="85" r="7" fill="#f3b47f" stroke="none" stroke-width="2"/><line x1="133" y1="139" x2="207" y2="91" stroke="#b9a2ff" stroke-width="2.7"/><polygon points="207,91 202.41,98.74 198.06,92.04" fill="#b9a2ff" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="78" y="218" fill="#9bb0ca" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">a*</text><text x="35" y="60" fill="#9bb0ca" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">b*</text><text x="100" y="45" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">Δa*=3，Δb*=4</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">ΔE₇₆ = √(3²+4²)=5</text></svg>