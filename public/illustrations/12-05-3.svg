<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>另一个点：光源路径畅通</title><desc>光源到右侧地面点的路径绕过遮挡物，阴影图存的是同一个地面深度，所以比较通过。</desc><rect width="360" height="264" fill="#0b1421"/><circle cx="180" cy="35" r="9" fill="#f3b47f" stroke="none" stroke-width="2"/><rect x="139" y="99" width="82" height="24" rx="0" fill="#ff8c9f" stroke="none"/><line x1="48" y1="204" x2="317" y2="204" stroke="#9bb0ca" stroke-width="3"/><line x1="180" y1="35" x2="292" y2="204" stroke="#82dfbd" stroke-width="2.7"/><polygon points="292,204 284.21,199.48 290.88,195.07" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><circle cx="292" cy="204" r="4" fill="#82dfbd" stroke="none" stroke-width="2"/><text x="300" y="195" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">P</text><text x="47" y="172" fill="#82dfbd" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">深度相等</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">同一深度映射：不是比较世界距离</text></svg>