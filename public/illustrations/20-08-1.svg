<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>加色：能量相加</title><desc>简化三离散波段中，红 [1,0,0] 加绿 [0,1,0] 得 [1,1,0]，示意黄色发光。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="35" y="70" width="80" height="95" rx="0" fill="#ff0000" stroke="none"/><text x="131" y="123" fill="#e0eaf7" font-size="24" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">+</text><rect x="165" y="70" width="80" height="95" rx="0" fill="#00ff00" stroke="none"/><text x="269" y="123" fill="#e0eaf7" font-size="24" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">=</text><rect x="302" y="70" width="35" height="95" rx="0" fill="#ffff00" stroke="none"/><text x="20" y="28" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">红光 + 绿光</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">无光是黑；三通道相加是白</text></svg>