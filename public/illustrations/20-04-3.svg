<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>三响应完全相同</title><desc>本图采用 qS′=[1,.5,0,0]、qM′=[0,.5,.5,0]、qL′=[0,0,.5,1]；分别点乘两个光谱。</desc><rect width="360" height="264" fill="#0b1421"/><text x="18" y="25" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">三通道离散响应模型</text><text x="24" y="80" fill="#9bb0ca" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">S′</text><rect x="65" y="60" width="165" height="26" rx="0" fill="#83baff" stroke="none"/><text x="235" y="80" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">1.5</text><text x="24" y="129" fill="#9bb0ca" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">M′</text><rect x="65" y="109" width="110" height="26" rx="0" fill="#82dfbd" stroke="none"/><text x="180" y="129" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">1</text><text x="24" y="178" fill="#9bb0ca" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">L′</text><rect x="65" y="158" width="165" height="26" rx="0" fill="#f3b47f" stroke="none"/><text x="235" y="178" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">1.5</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">A 与 B 都得到 (1.5,1,1.5)</text></svg>