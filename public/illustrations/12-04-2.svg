<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>最优点比中点误差更小</title><desc>候选端点 A=(-1,0)、B=(0,1) 各为 E=1；中点 E=0.5，最优交点 E=0。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="180" y1="38" x2="180" y2="213" stroke="#2a3d55" stroke-width="2"/><line x1="43" y1="150" x2="316" y2="150" stroke="#2a3d55" stroke-width="2"/><circle cx="110" cy="150" r="4" fill="#83baff" stroke="none" stroke-width="2"/><text x="118" y="141" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">A：1</text><circle cx="180" cy="80" r="4" fill="#b9a2ff" stroke="none" stroke-width="2"/><text x="188" y="71" fill="#b9a2ff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">B：1</text><circle cx="145" cy="115" r="4" fill="#f3b47f" stroke="none" stroke-width="2"/><text x="153" y="106" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">中点：0.5</text><circle cx="180" cy="150" r="7" fill="#82dfbd" stroke="none" stroke-width="2"/><text x="196" y="173" fill="#82dfbd" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">最优：0</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">几何误差最小点不必是中点</text></svg>