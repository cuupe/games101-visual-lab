<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>边缘附近的局部平均</title><desc>窗口内的三个值是 0、1、1；加权后得到 0.75，边缘形成中间亮度。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="40" y="74" width="85" height="80" rx="0" fill="#000000" stroke="#9bb0ca"/><rect x="125" y="74" width="85" height="80" rx="0" fill="#ffffff" stroke="#9bb0ca"/><rect x="210" y="74" width="85" height="80" rx="0" fill="#ffffff" stroke="#9bb0ca"/><text x="82" y="183" fill="#83baff" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">0×1/4</text><text x="168" y="183" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">1×1/2</text><text x="253" y="183" fill="#83baff" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">1×1/4</text><rect x="148" y="195" width="48" height="31" rx="0" fill="#bfbfbf" stroke="none"/><text x="179" y="42" fill="#e0eaf7" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">窗口覆盖黑白交界</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">0 + 0.5 + 0.25 = 0.75</text></svg>