<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>有向面积</title><desc>叉积同时记录平面方向与平行四边形面积。</desc><rect width="360" height="264" fill="#0b1421"/><polygon points="180,156 290,156 290,73.5 180,73.5" fill="#183c3c" stroke="#2a3d55" stroke-width="2" stroke-linejoin="round"/><line x1="180" y1="156" x2="290" y2="156" stroke="#82dfbd" stroke-width="2.7"/><polygon points="290,156 281.94,160 281.94,152" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="180" y1="156" x2="180" y2="73.5" stroke="#b9a2ff" stroke-width="2.7"/><polygon points="180,73.5 184,81.56 176,81.56" fill="#b9a2ff" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="180" y1="156" x2="105.9" y2="195.9" stroke="#f3b47f" stroke-width="2.7"/><polygon points="105.9,195.9 111.11,188.56 114.89,195.59" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="37" y="212" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">n 朝向 +z</text><text x="45" y="35" fill="#e0eaf7" font-size="20" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">右手定则</text><text x="180" y="248" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">平行四边形面积 = 3</text></svg>