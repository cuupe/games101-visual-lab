<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>短区间可以有高密度</title><desc>在长度 .25 的区间内均匀分布，p=4 合法，总概率仍为 1。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="146" y="53" width="58" height="137" rx="0" fill="#274a48" stroke="#82dfbd"/><line x1="51" y1="190" x2="316" y2="190" stroke="#9bb0ca" stroke-width="2"/><line x1="51" y1="190" x2="51" y2="45" stroke="#9bb0ca" stroke-width="2"/><line x1="51" y1="53" x2="205" y2="53" stroke="#9bb0ca" stroke-width="1.5" stroke-dasharray="4 4"/><text x="20" y="61" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">4</text><text x="127" y="217" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">0</text><text x="191" y="217" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">.25</text><text x="216" y="101" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">密度高</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">点值 p=4；概率 4×.25=1</text></svg>