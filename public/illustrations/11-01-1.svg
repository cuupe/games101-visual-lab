<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>点云：只有位置采样</title><desc>两行共 8 个点没有面连接，不能仅从位置推断唯一表面拓扑。</desc><rect width="360" height="264" fill="#0b1421"/><circle cx="70" cy="90" r="6" fill="#82dfbd" stroke="none" stroke-width="2"/><circle cx="140" cy="60" r="6" fill="#82dfbd" stroke="none" stroke-width="2"/><circle cx="220" cy="78" r="6" fill="#82dfbd" stroke="none" stroke-width="2"/><circle cx="290" cy="113" r="6" fill="#82dfbd" stroke="none" stroke-width="2"/><circle cx="70" cy="183" r="6" fill="#82dfbd" stroke="none" stroke-width="2"/><circle cx="140" cy="153" r="6" fill="#82dfbd" stroke="none" stroke-width="2"/><circle cx="220" cy="171" r="6" fill="#82dfbd" stroke="none" stroke-width="2"/><circle cx="290" cy="206" r="6" fill="#82dfbd" stroke="none" stroke-width="2"/><text x="180" y="32" fill="#e0eaf7" font-size="18" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">8 个相同位置样本</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">位置和连接关系是不同信息</text></svg>