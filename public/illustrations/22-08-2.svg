<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>同一时刻的步长收敛</title><desc>无阻尼 k=4，显式 Euler 在 t=1 s 的位置；橙虚线为解析 cos(2)。横轴是步长 h。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="45" y1="55" x2="45" y2="205" stroke="#2a3d55" stroke-width="0.65"/><line x1="75" y1="55" x2="75" y2="205" stroke="#2a3d55" stroke-width="0.65"/><line x1="105" y1="55" x2="105" y2="205" stroke="#2a3d55" stroke-width="0.65"/><line x1="135" y1="55" x2="135" y2="205" stroke="#2a3d55" stroke-width="0.65"/><line x1="165" y1="55" x2="165" y2="205" stroke="#2a3d55" stroke-width="0.65"/><line x1="195" y1="55" x2="195" y2="205" stroke="#2a3d55" stroke-width="0.65"/><line x1="225" y1="55" x2="225" y2="205" stroke="#2a3d55" stroke-width="0.65"/><line x1="255" y1="55" x2="255" y2="205" stroke="#2a3d55" stroke-width="0.65"/><line x1="285" y1="55" x2="285" y2="205" stroke="#2a3d55" stroke-width="0.65"/><line x1="315" y1="55" x2="315" y2="205" stroke="#2a3d55" stroke-width="0.65"/><line x1="45" y1="55" x2="315" y2="55" stroke="#2a3d55" stroke-width="0.65"/><line x1="45" y1="85" x2="315" y2="85" stroke="#2a3d55" stroke-width="0.65"/><line x1="45" y1="115" x2="315" y2="115" stroke="#2a3d55" stroke-width="0.65"/><line x1="45" y1="145" x2="315" y2="145" stroke="#2a3d55" stroke-width="0.65"/><line x1="45" y1="175" x2="315" y2="175" stroke="#2a3d55" stroke-width="0.65"/><line x1="45" y1="205" x2="315" y2="205" stroke="#2a3d55" stroke-width="0.65"/><line x1="45" y1="205" x2="315" y2="205" stroke="#9bb0ca" stroke-width="2"/><line x1="45" y1="55" x2="45" y2="205" stroke="#9bb0ca" stroke-width="2"/><text x="315" y="225" fill="#9bb0ca" font-size="16" text-anchor="end" font-family="Arial,Microsoft YaHei,sans-serif">h / s</text><text x="25" y="48" fill="#9bb0ca" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">x(1)</text><text x="43" y="225" fill="#9bb0ca" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">0.01</text><text x="45" y="53" fill="#9bb0ca" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">-0.32</text><polyline points="45,116.32 63,121.84 99,131.74 171,145.76 315,142.69" fill="none" stroke="#83baff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="45,110.47 315,110.47" fill="none" stroke="#f3b47f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="20" y="25" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">每组步数 = 1/h</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">减小 h，结果应趋向解析值</text></svg>