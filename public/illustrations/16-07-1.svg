<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>像素面积内的子样本</title><desc>网格覆盖同一像素；不同样本可能分属几何与背景，决定抗锯齿结果。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="84" y="53" width="182" height="159" rx="0" fill="#142235" stroke="#83baff"/><polygon points="84,53 266,53 84,212" fill="#27463e" stroke="none" stroke-width="2" stroke-linejoin="round"/><circle cx="108" cy="76" r="5" fill="#82dfbd" stroke="none" stroke-width="2"/><circle cx="184" cy="77" r="5" fill="#82dfbd" stroke="none" stroke-width="2"/><circle cx="238" cy="81" r="5" fill="#f3b47f" stroke="none" stroke-width="2"/><circle cx="112" cy="143" r="5" fill="#82dfbd" stroke="none" stroke-width="2"/><circle cx="191" cy="142" r="5" fill="#f3b47f" stroke="none" stroke-width="2"/><circle cx="238" cy="182" r="5" fill="#f3b47f" stroke="none" stroke-width="2"/><circle cx="146" cy="188" r="5" fill="#f3b47f" stroke="none" stroke-width="2"/><text x="27" y="25" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">同一像素内采样</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">像素采样平均的是覆盖后的颜色</text></svg>