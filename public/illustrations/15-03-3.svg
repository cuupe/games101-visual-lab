<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>漏掉 π 会产生额外能量</title><desc>若误把 fᵣ 设为 .6，半球余弦积分得到 .6π，已经大于 1。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="65" y="125.03" width="78.33" height="68.97" rx="0" fill="#83baff" stroke="none"/><rect x="147.33" y="152.62" width="78.33" height="41.38" rx="0" fill="#82dfbd" stroke="none"/><rect x="229.67" y="64" width="78.33" height="130" rx="0" fill="#ff8c9f" stroke="none"/><line x1="63" y1="194" x2="310" y2="194" stroke="#9bb0ca" stroke-width="1.4"/><text x="59" y="221" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">入射</text><text x="142" y="221" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">正确</text><text x="221" y="221" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">错误</text><text x="52" y="54" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">1.0</text><text x="141" y="144" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">.6</text><text x="218" y="47" fill="#ff8c9f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">1.885</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">ρ=.6 ≠ 常量 BRDF=.6</text></svg>