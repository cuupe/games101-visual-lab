<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>局部着色需要三个方向</title><desc>蓝色 n 是表面法线，橙色 l 指向光源，紫色 v 指向观察者。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="45" y1="192" x2="315" y2="192" stroke="#9bb0ca" stroke-width="3"/><circle cx="168" cy="192" r="5" fill="#e0eaf7" stroke="none" stroke-width="2"/><line x1="168" y1="192" x2="168" y2="75" stroke="#83baff" stroke-width="2.7"/><polygon points="168,75 172,83.06 164,83.06" fill="#83baff" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="152" y="68" fill="#83baff" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">n</text><line x1="168" y1="192" x2="276" y2="78" stroke="#f3b47f" stroke-width="2.7"/><polygon points="276,78 273.35,86.6 267.55,81.11" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="281" y="75" fill="#f3b47f" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">l</text><line x1="168" y1="192" x2="310" y2="165" stroke="#b9a2ff" stroke-width="2.7"/><polygon points="310,165 302.82,170.43 301.33,162.58" fill="#b9a2ff" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="313" y="155" fill="#b9a2ff" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">v</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">所有向量必须处于同一坐标空间</text></svg>