<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>偏差与噪声是两种误差</title><desc>紫色结果密集但中心偏离真值；蓝色结果分散但中心在真值附近。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="135" y1="57" x2="135" y2="205" stroke="#82dfbd" stroke-width="2" stroke-dasharray="5 4"/><circle cx="173" cy="88" r="4" fill="#b9a2ff" stroke="none" stroke-width="2"/><circle cx="176" cy="103" r="4" fill="#b9a2ff" stroke="none" stroke-width="2"/><circle cx="180" cy="118" r="4" fill="#b9a2ff" stroke="none" stroke-width="2"/><circle cx="184" cy="88" r="4" fill="#b9a2ff" stroke="none" stroke-width="2"/><circle cx="187" cy="103" r="4" fill="#b9a2ff" stroke="none" stroke-width="2"/><circle cx="180" cy="118" r="4" fill="#b9a2ff" stroke="none" stroke-width="2"/><circle cx="177" cy="88" r="4" fill="#b9a2ff" stroke="none" stroke-width="2"/><circle cx="183" cy="103" r="4" fill="#b9a2ff" stroke="none" stroke-width="2"/><line x1="135" y1="57" x2="135" y2="205" stroke="#82dfbd" stroke-width="2" stroke-dasharray="5 4"/><circle cx="97" cy="152" r="4" fill="#83baff" stroke="none" stroke-width="2"/><circle cx="116" cy="167" r="4" fill="#83baff" stroke="none" stroke-width="2"/><circle cx="140" cy="182" r="4" fill="#83baff" stroke="none" stroke-width="2"/><circle cx="150" cy="152" r="4" fill="#83baff" stroke="none" stroke-width="2"/><circle cx="121" cy="167" r="4" fill="#83baff" stroke="none" stroke-width="2"/><circle cx="134" cy="182" r="4" fill="#83baff" stroke="none" stroke-width="2"/><circle cx="160" cy="152" r="4" fill="#83baff" stroke="none" stroke-width="2"/><circle cx="161" cy="167" r="4" fill="#83baff" stroke="none" stroke-width="2"/><text x="197" y="87" fill="#b9a2ff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">低方差有偏</text><text x="199" y="164" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">较高方差</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">MSE = 方差 + 偏差²</text></svg>