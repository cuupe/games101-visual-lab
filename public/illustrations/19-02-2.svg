<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>36 mm / 25 mm</title><desc>保持感光面宽度，把焦距减半；半角由 s/(2f) 决定。</desc><rect width="360" height="264" fill="#0b1421"/><text x="24" y="26" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">f=25 mm，s=36 mm</text><line x1="45" y1="132" x2="320" y2="132" stroke="#2a3d55" stroke-width="1" stroke-dasharray="4 4"/><polygon points="65,132 165,60 165,204" fill="#142235" stroke="#82dfbd" stroke-width="2" stroke-linejoin="round"/><circle cx="65" cy="132" r="5" fill="#f3b47f" stroke="none" stroke-width="2"/><line x1="165" y1="60" x2="165" y2="204" stroke="#83baff" stroke-width="4"/><text x="175" y="132" fill="#83baff" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">s</text><text x="115" y="154" fill="#f3b47f" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">f</text><text x="72" y="86" fill="#82dfbd" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">71.51°</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">水平 FOV ≈ 71.51°</text></svg>