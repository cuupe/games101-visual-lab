<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>物体与世界坐标的区别</title><desc>物体右移时，左图规则随物体移动；右图规则固定在世界中，显现不同局部纹理。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="31" y="69" width="130" height="125" rx="0" fill="#142235" stroke="#83baff"/><rect x="200" y="69" width="130" height="125" rx="0" fill="#142235" stroke="#b9a2ff"/><line x1="38" y1="75" x2="38" y2="188" stroke="#82dfbd" stroke-width="5"/><line x1="72" y1="75" x2="72" y2="188" stroke="#82dfbd" stroke-width="5"/><line x1="106" y1="75" x2="106" y2="188" stroke="#82dfbd" stroke-width="5"/><line x1="140" y1="75" x2="140" y2="188" stroke="#82dfbd" stroke-width="5"/><line x1="214" y1="75" x2="214" y2="188" stroke="#f3b47f" stroke-width="5"/><line x1="245" y1="75" x2="245" y2="188" stroke="#f3b47f" stroke-width="5"/><line x1="276" y1="75" x2="276" y2="188" stroke="#f3b47f" stroke-width="5"/><line x1="307" y1="75" x2="307" y2="188" stroke="#f3b47f" stroke-width="5"/><line x1="45" y1="210" x2="145" y2="210" stroke="#83baff" stroke-width="2.7"/><polygon points="145,210 136.94,214 136.94,206" fill="#83baff" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="211" y1="210" x2="311" y2="210" stroke="#b9a2ff" stroke-width="2.7"/><polygon points="311,210 302.94,214 302.94,206" fill="#b9a2ff" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="35" y="53" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">物体坐标</text><text x="204" y="53" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">世界坐标</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">学习边界：说明表示、采样和误差</text></svg>