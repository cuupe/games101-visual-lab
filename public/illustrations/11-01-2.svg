<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>网格：明确连接成表面</title><desc>与点云使用相同的 8 个位置，通过边和面连接成三块四边形。</desc><rect width="360" height="264" fill="#0b1421"/><polygon points="70,90 140,60 140,153 70,183" fill="#82dfbd33" stroke="#82dfbd" stroke-width="2" stroke-linejoin="round"/><polygon points="140,60 220,78 220,171 140,153" fill="#82dfbd33" stroke="#82dfbd" stroke-width="2" stroke-linejoin="round"/><polygon points="220,78 290,113 290,206 220,171" fill="#82dfbd33" stroke="#82dfbd" stroke-width="2" stroke-linejoin="round"/><circle cx="70" cy="90" r="5" fill="#f3b47f" stroke="none" stroke-width="2"/><circle cx="140" cy="60" r="5" fill="#f3b47f" stroke="none" stroke-width="2"/><circle cx="220" cy="78" r="5" fill="#f3b47f" stroke="none" stroke-width="2"/><circle cx="290" cy="113" r="5" fill="#f3b47f" stroke="none" stroke-width="2"/><circle cx="70" cy="183" r="5" fill="#f3b47f" stroke="none" stroke-width="2"/><circle cx="140" cy="153" r="5" fill="#f3b47f" stroke="none" stroke-width="2"/><circle cx="220" cy="171" r="5" fill="#f3b47f" stroke="none" stroke-width="2"/><circle cx="290" cy="206" r="5" fill="#f3b47f" stroke="none" stroke-width="2"/><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">连接关系决定表面拓扑</text></svg>