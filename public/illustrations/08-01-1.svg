<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>半程向量平分两个方向</title><desc>光与观察方向各偏离法线 45°；相加再归一化，半程向量恰好与 n 同向。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="40" y1="203" x2="320" y2="203" stroke="#9bb0ca" stroke-width="2"/><line x1="180" y1="203" x2="90" y2="113" stroke="#f3b47f" stroke-width="2.7"/><polygon points="90,113 98.53,115.88 92.88,121.53" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="180" y1="203" x2="270" y2="113" stroke="#b9a2ff" stroke-width="2.7"/><polygon points="270,113 267.12,121.53 261.47,115.88" fill="#b9a2ff" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="180" y1="203" x2="180" y2="73" stroke="#82dfbd" stroke-width="2.7"/><polygon points="180,73 184,81.06 176,81.06" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="79" y="97" fill="#f3b47f" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">l</text><text x="277" y="97" fill="#b9a2ff" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">v</text><text x="171" y="56" fill="#82dfbd" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">h = n</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">n·h = 1，高光项达到最大</text></svg>