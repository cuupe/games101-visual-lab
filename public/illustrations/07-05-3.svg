<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>距点光源 r = 3</title><desc>光源功率不变；此图圆半径与距离成比例，球面面积随 r² 增长。</desc><rect width="360" height="264" fill="#0b1421"/><circle cx="180" cy="121" r="87" fill="none" stroke="#83baff" stroke-width="2"/><circle cx="180" cy="121" r="9" fill="#f3b47f" stroke="none" stroke-width="2"/><line x1="180" y1="121" x2="267" y2="121" stroke="#82dfbd" stroke-width="2.7"/><polygon points="267,121 258.94,125 258.94,117" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="223.5" y="111" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">r=3</text><text x="180" y="33" fill="#e0eaf7" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">相对球面面积：9</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">照度比例 = 1/9 = 0.111</text></svg>