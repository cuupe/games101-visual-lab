<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>内部边：不是总取中点</title><desc>A=(90,130)、B=(270,130)，对面 C=(90,40)、D=(90,200)。新点为 (157.5,127.5)，不同于中点。</desc><rect width="360" height="264" fill="#0b1421"/><polygon points="90,130 270,130 90,40" fill="#83baff22" stroke="#83baff" stroke-width="2" stroke-linejoin="round"/><polygon points="90,130 270,130 90,200" fill="#b9a2ff22" stroke="#b9a2ff" stroke-width="2" stroke-linejoin="round"/><circle cx="90" cy="130" r="4" fill="#83baff" stroke="none" stroke-width="2"/><text x="98" y="121" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">A</text><circle cx="270" cy="130" r="4" fill="#83baff" stroke="none" stroke-width="2"/><text x="278" y="121" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">B</text><circle cx="90" cy="40" r="4" fill="#b9a2ff" stroke="none" stroke-width="2"/><text x="98" y="31" fill="#b9a2ff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">C</text><circle cx="90" cy="200" r="4" fill="#b9a2ff" stroke="none" stroke-width="2"/><text x="98" y="191" fill="#b9a2ff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">D</text><circle cx="180" cy="130" r="5" fill="none" stroke="#9bb0ca" stroke-width="2"/><circle cx="157.5" cy="127.5" r="6" fill="#f3b47f" stroke="none" stroke-width="2"/><text x="176" y="167" fill="#f3b47f" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">新边点</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">3/8(A+B) + 1/8(C+D)</text></svg>