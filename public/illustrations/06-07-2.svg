<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>TAA：跨帧抖动采样</title><desc>四个时间帧把采样位置移到同一像素中的不同子位置。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="87" y="40" width="180" height="180" rx="0" fill="#142235" stroke="#9bb0ca"/><circle cx="132" cy="85" r="7" fill="#83baff" stroke="none" stroke-width="2"/><text x="145" y="90" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">帧 1</text><circle cx="222" cy="85" r="7" fill="#82dfbd" stroke="none" stroke-width="2"/><text x="235" y="90" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">帧 2</text><circle cx="132" cy="175" r="7" fill="#b9a2ff" stroke="none" stroke-width="2"/><text x="145" y="180" fill="#b9a2ff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">帧 3</text><circle cx="222" cy="175" r="7" fill="#f3b47f" stroke="none" stroke-width="2"/><text x="235" y="180" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">帧 4</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">累积多个时刻的真实采样信息</text></svg>