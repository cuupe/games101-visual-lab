<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>平行情况不能相除</title><desc>光线方向与平面法线垂直，分母为零；图中原点不在平面上。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="28" y1="180" x2="332" y2="180" stroke="#83baff" stroke-width="4"/><line x1="42" y1="91" x2="320" y2="91" stroke="#f3b47f" stroke-width="2.7"/><polygon points="320,91 311.94,95 311.94,87" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="181" y1="180" x2="181" y2="65" stroke="#82dfbd" stroke-width="2.7"/><polygon points="181,65 185,73.06 177,73.06" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="190" y="70" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">n</text><text x="97" y="119" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">d 与 n 垂直</text><text x="99" y="210" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">平面 y=0</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">d·n=0：平行且无交</text></svg>