<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>互易性与能量守恒分别检查</title><desc>交换 wi 与 wo 检查函数；半球积分检查总反射能量，二者不能混为一谈。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="27" y="50" width="305" height="70" rx="6" fill="#142235" stroke="#83baff"/><rect x="27" y="150" width="305" height="70" rx="6" fill="#142235" stroke="#82dfbd"/><text x="49" y="79" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">互易：fᵣ(wi,wo)=fᵣ(wo,wi)</text><text x="49" y="106" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">交换方向，不是换光照图像</text><text x="49" y="181" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">守恒：∫ fᵣ cosθ dω ≤ 1</text><text x="49" y="208" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">约束整个出射半球</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">非负、互易、守恒是不同性质</text></svg>