<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>增加数量时同步归一化权重</title><desc>二个样本各带 .5 与十个样本各带 .1，都代表同一单位总功率。</desc><rect width="360" height="264" fill="#0b1421"/><circle cx="85" cy="86" r="12" fill="#83baff" stroke="none" stroke-width="2"/><circle cx="136" cy="86" r="12" fill="#83baff" stroke="none" stroke-width="2"/><circle cx="52" cy="155" r="6" fill="#82dfbd" stroke="none" stroke-width="2"/><circle cx="112" cy="155" r="6" fill="#82dfbd" stroke="none" stroke-width="2"/><circle cx="172" cy="155" r="6" fill="#82dfbd" stroke="none" stroke-width="2"/><circle cx="232" cy="155" r="6" fill="#82dfbd" stroke="none" stroke-width="2"/><circle cx="292" cy="155" r="6" fill="#82dfbd" stroke="none" stroke-width="2"/><circle cx="52" cy="187" r="6" fill="#82dfbd" stroke="none" stroke-width="2"/><circle cx="112" cy="187" r="6" fill="#82dfbd" stroke="none" stroke-width="2"/><circle cx="172" cy="187" r="6" fill="#82dfbd" stroke="none" stroke-width="2"/><circle cx="232" cy="187" r="6" fill="#82dfbd" stroke="none" stroke-width="2"/><circle cx="292" cy="187" r="6" fill="#82dfbd" stroke="none" stroke-width="2"/><text x="165" y="91" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">2 × .5 = 1</text><text x="65" y="227" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">10 × .1 = 1</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">不能让 VPL 数量直接放大间接光</text></svg>