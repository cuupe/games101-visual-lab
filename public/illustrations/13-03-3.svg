<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>原点在球内时筛选根</title><desc>负根位于射线后方，前方出口才是合法命中。</desc><rect width="360" height="264" fill="#0b1421"/><circle cx="180" cy="132" r="68" fill="#142235" stroke="#82dfbd" stroke-width="2"/><line x1="83" y1="132" x2="180" y2="132" stroke="#83baff" stroke-width="2" stroke-dasharray="5 4"/><line x1="180" y1="132" x2="326" y2="132" stroke="#83baff" stroke-width="2.7"/><polygon points="326,132 317.94,136 317.94,128" fill="#83baff" stroke="none" stroke-width="2" stroke-linejoin="round"/><circle cx="180" cy="132" r="4" fill="#83baff" stroke="none" stroke-width="2"/><text x="187" y="124" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">o</text><circle cx="112" cy="132" r="5" fill="#ff8c9f" stroke="none" stroke-width="2"/><circle cx="248" cy="132" r="5" fill="#f3b47f" stroke="none" stroke-width="2"/><text x="67" y="98" fill="#ff8c9f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">t=−1</text><text x="228" y="98" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">t=1</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">取区间内的最小正根</text></svg>