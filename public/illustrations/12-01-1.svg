<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>细分：增加元素</title><desc>把一片三角形分成四片；仅连线并不会自动平滑，位置更新仍不可少。</desc><rect width="360" height="264" fill="#0b1421"/><polygon points="55,202 311,202 160,46" fill="#82dfbd33" stroke="#82dfbd" stroke-width="2" stroke-linejoin="round"/><polygon points="183,202 235.5,124 107.5,124" fill="#b9a2ff44" stroke="#82dfbd" stroke-width="2" stroke-linejoin="round"/><circle cx="183" cy="202" r="5" fill="#f3b47f" stroke="none" stroke-width="2"/><circle cx="235.5" cy="124" r="5" fill="#f3b47f" stroke="none" stroke-width="2"/><circle cx="107.5" cy="124" r="5" fill="#f3b47f" stroke="none" stroke-width="2"/><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">面数增加：1 → 4</text></svg>