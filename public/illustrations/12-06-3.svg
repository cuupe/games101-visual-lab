<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>PCF：平均多个比较结果</title><desc>四次比较分别得到受光 1、1 和遮挡 0、0；平均的是可见性判断，不是直接平均深度。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="71" y="51" width="96" height="72" rx="0" fill="#e0eaf7" stroke="#9bb0ca"/><text x="119" y="94" fill="#0b1421" font-size="20" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">1</text><rect x="167" y="51" width="96" height="72" rx="0" fill="#e0eaf7" stroke="#9bb0ca"/><text x="215" y="94" fill="#0b1421" font-size="20" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">1</text><rect x="71" y="123" width="96" height="72" rx="0" fill="#0b1421" stroke="#9bb0ca"/><text x="119" y="166" fill="#e0eaf7" font-size="20" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">0</text><rect x="167" y="123" width="96" height="72" rx="0" fill="#0b1421" stroke="#9bb0ca"/><text x="215" y="166" fill="#e0eaf7" font-size="20" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">0</text><line x1="277" y1="125" x2="309" y2="125" stroke="#f3b47f" stroke-width="2.7"/><polygon points="309,125 300.94,129 300.94,121" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><rect x="313" y="79" width="20" height="98" rx="0" fill="#808080" stroke="none"/><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">可见性 = (1+1+0+0)/4 = 0.5</text></svg>