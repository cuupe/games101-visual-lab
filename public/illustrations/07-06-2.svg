<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>先统一空间，再归一化</title><desc>两根同向单位向量长度均为 1，点积才能表示夹角余弦。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="110" y1="208" x2="110" y2="96" stroke="#83baff" stroke-width="4"/><polygon points="110,96 114,104.06 106,104.06" fill="#83baff" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="220" y1="208" x2="220" y2="96" stroke="#f3b47f" stroke-width="4"/><polygon points="220,96 224,104.06 216,104.06" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="63" y="75" fill="#83baff" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">单位法线</text><text x="191" y="75" fill="#f3b47f" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">单位光向</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">正确：normalize(n)·l = 1</text></svg>