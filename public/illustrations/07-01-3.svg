<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>没有统一的图元顺序</title><desc>正确结果在交点左侧显示红、右侧显示蓝。把整块红或整块蓝画在最后都不正确。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="40" y="65" width="140" height="130" rx="0" fill="#ff8c9f" stroke="none"/><rect x="180" y="65" width="140" height="130" rx="0" fill="#83baff" stroke="none"/><line x1="180" y1="55" x2="180" y2="205" stroke="#f3b47f" stroke-width="2" stroke-dasharray="5 4"/><text x="110" y="41" fill="#ff8c9f" font-size="18" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">红更近</text><text x="250" y="41" fill="#83baff" font-size="18" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">蓝更近</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">需要逐采样位置判断可见性</text></svg>