<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>插值之后必须归一化</title><desc>两个正交单位法线的平均为 (0.5,0.5)，长度仅为 √0.5；绿色把它重新单位化。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="70" y1="204" x2="240" y2="204" stroke="#83baff" stroke-width="2.7"/><polygon points="240,204 231.94,208 231.94,200" fill="#83baff" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="70" y1="204" x2="70" y2="34" stroke="#b9a2ff" stroke-width="2.7"/><polygon points="70,34 74,42.06 66,42.06" fill="#b9a2ff" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="70" y1="204" x2="155" y2="119" stroke="#f3b47f" stroke-width="4"/><polygon points="155,119 152.12,127.53 146.47,121.88" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="70" y1="204" x2="190" y2="84" stroke="#82dfbd" stroke-width="3"/><polygon points="190,84 187.12,92.53 181.47,86.88" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="179" y="137" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">原平均</text><text x="191" y="73" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">单位化</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">(0.5,0.5) → (0.707,0.707)</text></svg>