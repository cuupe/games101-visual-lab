<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>同力，不同质量</title><desc>两物体均受 6 N：质量 2 kg 加速度 3 m/s²，质量 3 kg 加速度 2 m/s²。箭头长度表示加速度。</desc><rect width="360" height="264" fill="#0b1421"/><circle cx="75" cy="95" r="19" fill="#83baff" stroke="none" stroke-width="2"/><line x1="107" y1="95" x2="267" y2="95" stroke="#82dfbd" stroke-width="2.7"/><polygon points="267,95 258.94,99 258.94,91" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="30" y="62" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">m=2，a=3</text><circle cx="75" cy="182" r="26" fill="#f3b47f" stroke="none" stroke-width="2"/><line x1="112" y1="182" x2="219" y2="182" stroke="#82dfbd" stroke-width="2.7"/><polygon points="219,182 210.94,186 210.94,178" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="30" y="145" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">m=3，a=2</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">a=F/m，质量不等于阻力</text></svg>