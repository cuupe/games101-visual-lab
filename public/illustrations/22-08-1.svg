<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>静止平衡反例</title><desc>三质量点的弹簧都在静止长度，速度为零，关闭重力；绿色点不应随积分步自行偏移。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="55" y1="124" x2="305" y2="124" stroke="#82dfbd" stroke-width="3"/><circle cx="55" cy="124" r="10" fill="#9bb0ca" stroke="none" stroke-width="2"/><text x="55" y="164" fill="#e0eaf7" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">v0=0</text><circle cx="180" cy="124" r="10" fill="#82dfbd" stroke="none" stroke-width="2"/><text x="180" y="164" fill="#e0eaf7" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">v1=0</text><circle cx="305" cy="124" r="10" fill="#82dfbd" stroke="none" stroke-width="2"/><text x="305" y="164" fill="#e0eaf7" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">v2=0</text><rect x="39" y="107" width="31" height="34" rx="0" fill="none" stroke="#f3b47f"/><text x="20" y="25" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">左端固定；F弹簧=0</text><text x="65" y="207" fill="#9bb0ca" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">检查残留力与固定点</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">平衡状态应始终静止</text></svg>