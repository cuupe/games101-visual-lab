<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>已累计的直接光不重复补偿</title><desc>先累计 D=.2；轮盘只处理未来 C=.6，保持原直接项。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="33" y="77" width="129" height="90" rx="7" fill="#142235" stroke="#83baff"/><rect x="197" y="77" width="129" height="90" rx="7" fill="#142235" stroke="#82dfbd"/><text x="97" y="111" fill="#83baff" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">直接 D=.2</text><text x="97" y="143" fill="#83baff" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">已累计</text><text x="261" y="111" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">后续 C=.6</text><text x="261" y="143" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">存活才 ÷q</text><line x1="169" y1="120" x2="191" y2="120" stroke="#f3b47f" stroke-width="2.7"/><polygon points="191,120 182.94,124 182.94,116" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">总期望 D+q(C/q)=.8</text></svg>