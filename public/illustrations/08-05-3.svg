<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>片元与深度阶段</title><desc>片元着色计算颜色；更近的绿色 0.3 通过深度测试，远处红色 0.8 被拒绝。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="35" y="58" width="99" height="67" rx="0" fill="#ff8c9f66" stroke="none"/><text x="84" y="151" fill="#ff8c9f" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">z = 0.8</text><rect x="35" y="169" width="99" height="43" rx="0" fill="#82dfbd" stroke="none"/><text x="84" y="195" fill="#0b1421" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">z = 0.3</text><line x1="146" y1="134" x2="198" y2="134" stroke="#f3b47f" stroke-width="2.7"/><polygon points="198,134 189.94,138 189.94,130" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><rect x="220" y="82" width="103" height="103" rx="0" fill="#82dfbd" stroke="none"/><text x="270" y="213" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">最终像素</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">覆盖、着色、可见性是不同任务</text></svg>