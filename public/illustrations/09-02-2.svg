<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>错误：直接插值 u</title><desc>屏幕中点 s=0.5 直接取两端平均得到 u=0.5，但这里没有还原不同端点的 w。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="43" y1="128" x2="317" y2="128" stroke="#9bb0ca" stroke-width="4"/><circle cx="180" cy="128" r="7" fill="#ff8c9f" stroke="none" stroke-width="2"/><text x="42" y="86" fill="#83baff" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">u₀ = 0</text><text x="237" y="86" fill="#b9a2ff" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">u₁ = 1</text><text x="180" y="170" fill="#ff8c9f" font-size="18" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">错误 u = 0.5</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">屏幕线性平均会造成纹理扭曲</text></svg>