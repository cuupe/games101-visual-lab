<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>面积 PDF 转换到方向 PDF</title><desc>光源端投影和距离决定灯片张角，接收端余弦再进入贡献。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="28" y1="199" x2="332" y2="199" stroke="#83baff" stroke-width="4"/><circle cx="99" cy="199" r="4" fill="#82dfbd" stroke="none" stroke-width="2"/><text x="106" y="191" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">p</text><line x1="251" y1="60" x2="318" y2="96" stroke="#f3b47f" stroke-width="5"/><line x1="99" y1="199" x2="282" y2="78" stroke="#82dfbd" stroke-width="2.7"/><polygon points="282,78 277.48,85.78 273.07,79.12" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="99" y1="199" x2="99" y2="107" stroke="#83baff" stroke-width="2.7"/><polygon points="99,107 103,115.06 95,115.06" fill="#83baff" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="282" y1="78" x2="248" y2="141" stroke="#b9a2ff" stroke-width="2.7"/><polygon points="248,141 248.31,132.01 255.35,135.8" fill="#b9a2ff" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="78" y="94" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">n</text><text x="242" y="162" fill="#b9a2ff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">nₗ</text><text x="190" y="183" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">距离 r</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">pω = pA r² / |cosθₗ|</text></svg>