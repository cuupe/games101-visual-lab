<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>裸传感器：方向混合</title><desc>追踪两种颜色到同一感光位置的路径；仅增加信号不能分离来源。</desc><rect width="360" height="264" fill="#0b1421"/><text x="25" y="25" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">传感器混合各方向</text><line x1="290" y1="48" x2="290" y2="215" stroke="#83baff" stroke-width="4"/><text x="246" y="42" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">感光面</text><circle cx="42" cy="70" r="6" fill="#f3b47f" stroke="none" stroke-width="2"/><line x1="42" y1="70" x2="290" y2="90" stroke="#f3b47f" stroke-width="1.7"/><line x1="42" y1="70" x2="290" y2="130" stroke="#f3b47f" stroke-width="1.7"/><line x1="42" y1="70" x2="290" y2="170" stroke="#f3b47f" stroke-width="1.7"/><circle cx="42" cy="175" r="6" fill="#b9a2ff" stroke="none" stroke-width="2"/><line x1="42" y1="175" x2="290" y2="90" stroke="#b9a2ff" stroke-width="1.7"/><line x1="42" y1="175" x2="290" y2="130" stroke="#b9a2ff" stroke-width="1.7"/><line x1="42" y1="175" x2="290" y2="170" stroke="#b9a2ff" stroke-width="1.7"/><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">同一数值可含多个方向</text></svg>