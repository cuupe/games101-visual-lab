<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>玻璃产生两条理想分支</title><desc>反射留在原介质，折射穿入另一介质，权重由界面响应决定。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="29" y="123" width="304" height="87" rx="0" fill="#173046" stroke="none"/><line x1="29" y1="123" x2="333" y2="123" stroke="#83baff" stroke-width="3"/><line x1="55" y1="43" x2="172" y2="123" stroke="#83baff" stroke-width="2.7"/><polygon points="172,123 163.09,121.75 167.6,115.15" fill="#83baff" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="172" y1="123" x2="290" y2="43" stroke="#82dfbd" stroke-width="2.7"/><polygon points="290,43 285.57,50.83 281.08,44.22" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="172" y1="123" x2="228" y2="207" stroke="#b9a2ff" stroke-width="2.7"/><polygon points="228,207 220.2,202.51 226.85,198.07" fill="#b9a2ff" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="172" y1="38" x2="172" y2="212" stroke="#9bb0ca" stroke-width="1.5" stroke-dasharray="5 4"/><text x="228" y="87" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">反射 F</text><text x="234" y="177" fill="#b9a2ff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">透射</text><text x="34" y="158" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">n₂ &gt; n₁</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">无吸收界面：反射 + 透射 = 1</text></svg>