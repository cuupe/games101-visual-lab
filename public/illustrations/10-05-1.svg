<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>并集：属于 A 或 B</title><desc>两个圆的全部内部都被着色；min(fA,fB)&lt;0 表示至少一个体内部。</desc><rect width="360" height="264" fill="#0b1421"/><circle cx="135" cy="125" r="64" fill="#82dfbd77" stroke="#82dfbd" stroke-width="2"/><circle cx="225" cy="125" r="64" fill="#82dfbd77" stroke="#82dfbd" stroke-width="2"/><text x="104" y="38" fill="#83baff" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">A</text><text x="233" y="38" fill="#b9a2ff" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">B</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">A∪B：min(fA,fB)</text></svg>