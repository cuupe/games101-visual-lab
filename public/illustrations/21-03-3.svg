<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>静止长度 1 m</title><desc>无阻尼且不计外力时，此配置应不自行运动，可作为代码平衡测试。</desc><rect width="360" height="264" fill="#0b1421"/><text x="20" y="25" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">ℓ=1 m，ℓ₀=1 m，k=10</text><polyline points="65,126 71.92,139 78.85,113 85.77,139 92.69,113 99.62,139 106.54,113 113.46,139 120.38,113 127.31,139 134.23,113 141.15,139 148.08,113 155,126" fill="none" stroke="#82dfbd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="65" cy="126" r="12" fill="#83baff" stroke="none" stroke-width="2"/><circle cx="155" cy="126" r="12" fill="#f3b47f" stroke="none" stroke-width="2"/><text x="132" y="179" fill="#9bb0ca" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">两端弹力为零</text><text x="35" y="218" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">Fₐ=0 N，Fᵦ=0 N</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">内部弹力总和恒为 0</text></svg>