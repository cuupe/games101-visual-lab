<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>双线性：分成三个 lerp</title><desc>上边 0→1 在 u=0.25 得到 0.25，下边 1→0 得到 0.75；再按 v=0.75 混合。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="57" y1="76" x2="304" y2="76" stroke="#83baff" stroke-width="3"/><circle cx="118.75" cy="76" r="6" fill="#83baff" stroke="none" stroke-width="2"/><text x="181" y="50" fill="#83baff" font-size="18" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">上边：0.25</text><line x1="57" y1="185" x2="304" y2="185" stroke="#b9a2ff" stroke-width="3"/><circle cx="118.75" cy="185" r="6" fill="#b9a2ff" stroke="none" stroke-width="2"/><text x="182" y="217" fill="#b9a2ff" font-size="18" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">下边：0.75</text><line x1="118.75" y1="87" x2="118.75" y2="175" stroke="#f3b47f" stroke-width="2.7"/><polygon points="118.75,175 114.75,166.94 122.75,166.94" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><circle cx="118.75" cy="157.75" r="6" fill="#82dfbd" stroke="none" stroke-width="2"/><text x="148" y="156" fill="#82dfbd" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">v = 0.75</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">0.25×0.25 + 0.75×0.75 = 0.625</text></svg>