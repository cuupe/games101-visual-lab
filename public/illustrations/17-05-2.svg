<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>各向异性依赖切线方向</title><desc>示意相同椭圆响应随纤维切线旋转；拉长轴代表方向相关响应。</desc><rect width="360" height="264" fill="#0b1421"/><path d="M 28 130 C 28 70 152 70 152 130 C 152 190 28 190 28 130" fill="none" stroke="#82dfbd" stroke-width="2.5"/><path d="M 263 67 C 325 67 325 199 263 199 C 201 199 201 67 263 67" fill="none" stroke="#b9a2ff" stroke-width="2.5"/><line x1="31" y1="132" x2="148" y2="132" stroke="#9bb0ca" stroke-width="1.5"/><polygon points="148,132 139.94,136 139.94,128" fill="#9bb0ca" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="263" y1="197" x2="263" y2="72" stroke="#9bb0ca" stroke-width="1.5"/><polygon points="263,72 267,80.06 259,80.06" fill="#9bb0ca" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="34" y="221" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">切线水平</text><text x="213" y="221" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">切线竖直</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">需保存表面切线与不同轴粗糙度</text></svg>