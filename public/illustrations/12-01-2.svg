<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>简化：删除元素并控制误差</title><desc>灰色六边形是旧边界，绿色将一个顶部顶点删除并用直边连接；局部轮廓出现误差。</desc><rect width="360" height="264" fill="#0b1421"/><polygon points="267,132 223.5,198.68 136.5,198.68 93,132 136.5,65.32 223.5,65.32" fill="none" stroke="#9bb0ca" stroke-width="2" stroke-linejoin="round"/><polygon points="267,132 223.5,198.68 136.5,198.68 93,132 223.5,65.32" fill="#82dfbd33" stroke="#82dfbd" stroke-width="3" stroke-linejoin="round"/><circle cx="136.5" cy="65.32" r="6" fill="#ff8c9f" stroke="none" stroke-width="2"/><text x="180" y="30" fill="#e0eaf7" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">减少元素，比较原边界</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">元素变少，误差不能忽略</text></svg>