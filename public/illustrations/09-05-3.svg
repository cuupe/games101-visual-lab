<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>三线性：相邻两层平滑切换</title><desc>需要 D=4.3 时，在第 4 层与第 5 层的双线性结果之间再插值；不是简单跳层。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="45" y="68" width="110" height="105" rx="0" fill="#83baff88" stroke="#83baff"/><rect x="210" y="68" width="110" height="105" rx="0" fill="#b9a2ff88" stroke="#b9a2ff"/><text x="100" y="48" fill="#83baff" font-size="18" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">第 4 层</text><text x="265" y="48" fill="#b9a2ff" font-size="18" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">第 5 层</text><text x="100" y="203" fill="#83baff" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">权重 0.7</text><text x="265" y="203" fill="#b9a2ff" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">权重 0.3</text><line x1="164" y1="119" x2="200" y2="119" stroke="#f3b47f" stroke-width="2.7"/><polygon points="200,119 191.94,123 191.94,115" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">结果 = 0.7C₄ + 0.3C₅</text></svg>