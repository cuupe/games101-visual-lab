<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>七维条件清单</title><desc>位置三维、方向二维，加波长与时间；每个彩色框表示一类变量。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="45" y="40" width="270" height="33" rx="5" fill="#142235" stroke="#83baff"/><text x="180" y="63" fill="#83baff" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">位置 x,y,z</text><rect x="45" y="83" width="270" height="33" rx="5" fill="#142235" stroke="#82dfbd"/><text x="180" y="106" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">方向 θ,φ</text><rect x="45" y="126" width="270" height="33" rx="5" fill="#142235" stroke="#f3b47f"/><text x="180" y="149" fill="#f3b47f" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">波长 λ</text><rect x="45" y="169" width="270" height="33" rx="5" fill="#142235" stroke="#b9a2ff"/><text x="180" y="192" fill="#b9a2ff" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">时间 τ</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">3+2+1+1=7 维</text></svg>