<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>体纹理：连续切片保存密度</title><desc>同一球状密度场的三个 z 切片：中心切片截面较大，两侧切片较小。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="25" y="65" width="90" height="125" rx="0" fill="#142235" stroke="#9bb0ca"/><circle cx="70" cy="127" r="26.42" fill="#83baff88" stroke="#83baff" stroke-width="2"/><text x="70" y="215" fill="#83baff" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">z=-0.7</text><rect x="135" y="65" width="90" height="125" rx="0" fill="#142235" stroke="#9bb0ca"/><circle cx="180" cy="127" r="37" fill="#83baff88" stroke="#83baff" stroke-width="2"/><text x="180" y="215" fill="#83baff" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">z=0</text><rect x="245" y="65" width="90" height="125" rx="0" fill="#142235" stroke="#9bb0ca"/><circle cx="290" cy="127" r="26.42" fill="#83baff88" stroke="#83baff" stroke-width="2"/><text x="290" y="215" fill="#83baff" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">z=0.7</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">三维数据中的 z 也参与查询</text></svg>