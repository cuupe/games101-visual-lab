<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>基准曝光</title><desc>光子条以固定照明、同一镜头近似 T/N² 标定；运动轨迹按 100 px/s 计算。</desc><rect width="360" height="264" fill="#0b1421"/><text x="25" y="25" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">f/2.8 · 1/100 s · ISO 100</text><text x="25" y="63" fill="#9bb0ca" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">光子收集</text><rect x="125" y="44" width="150" height="26" rx="0" fill="#82dfbd" stroke="none"/><text x="25" y="110" fill="#9bb0ca" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">输出增益</text><rect x="125" y="91" width="75" height="26" rx="0" fill="#b9a2ff" stroke="none"/><text x="25" y="151" fill="#9bb0ca" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">物体投影速度 100 px/s</text><line x1="55" y1="184" x2="125" y2="184" stroke="#f3b47f" stroke-width="15"/><circle cx="55" cy="184" r="6" fill="#e0eaf7" stroke="none" stroke-width="2"/><text x="55" y="218" fill="#f3b47f" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">轨迹长度 1 px</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">基准光量 1；轨迹 1 px</text></svg>