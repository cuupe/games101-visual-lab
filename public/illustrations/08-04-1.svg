<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>硬边需要两套法线</title><desc>两个相邻表面共享几何位置，但硬边两侧分别采用不同法线，不能只存一根平滑法线。</desc><rect width="360" height="264" fill="#0b1421"/><polygon points="70,181 178,123 178,47 70,104" fill="#83baff77" stroke="#83baff" stroke-width="2" stroke-linejoin="round"/><polygon points="178,123 285,181 285,104 178,47" fill="#82dfbd77" stroke="#82dfbd" stroke-width="2" stroke-linejoin="round"/><line x1="125" y1="120" x2="80" y2="73" stroke="#83baff" stroke-width="2.7"/><polygon points="80,73 88.46,76.06 82.69,81.59" fill="#83baff" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="232" y1="120" x2="282" y2="73" stroke="#82dfbd" stroke-width="2.7"/><polygon points="282,73 278.86,81.43 273.39,75.61" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="44" y="211" fill="#83baff" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">面 A 的法线</text><text x="218" y="211" fill="#82dfbd" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">面 B 的法线</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">同一位置可有独立的法线索引</text></svg>