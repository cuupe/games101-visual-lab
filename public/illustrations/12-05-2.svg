<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>第二遍：比较相同光空间深度</title><desc>相机可以看见地面 P，但它的光源空间深度为 0.8，大于对应阴影图的 0.4。</desc><rect width="360" height="264" fill="#0b1421"/><circle cx="180" cy="35" r="9" fill="#f3b47f" stroke="none" stroke-width="2"/><rect x="139" y="99" width="82" height="24" rx="0" fill="#ff8c9f" stroke="none"/><line x1="48" y1="204" x2="317" y2="204" stroke="#9bb0ca" stroke-width="3"/><circle cx="180" cy="204" r="4" fill="#83baff" stroke="none" stroke-width="2"/><text x="188" y="195" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">P</text><line x1="316" y1="97" x2="183" y2="201" stroke="#b9a2ff" stroke-width="2.7"/><polygon points="183,201 186.89,192.88 191.81,199.18" fill="#b9a2ff" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="303" y="77" fill="#b9a2ff" font-size="17" text-anchor="end" font-family="Arial,Microsoft YaHei,sans-serif">相机</text><line x1="180" y1="44" x2="180" y2="204" stroke="#f3b47f" stroke-width="2" stroke-dasharray="5 4"/><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">0.8 &gt; 0.4：光路被遮挡</text></svg>