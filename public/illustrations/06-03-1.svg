<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>离散卷积核</title><desc>三次邻域采样按 1/4、1/2、1/4 加权，权重总和为 1。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="47" y="160" width="86" height="35" rx="0" fill="#83baff" stroke="none"/><rect x="137" y="125" width="86" height="70" rx="0" fill="#82dfbd" stroke="none"/><rect x="227" y="160" width="86" height="35" rx="0" fill="#83baff" stroke="none"/><line x1="45" y1="195" x2="315" y2="195" stroke="#9bb0ca" stroke-width="1.4"/><text x="90" y="222" fill="#9bb0ca" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">−1</text><text x="180" y="222" fill="#9bb0ca" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">0</text><text x="270" y="222" fill="#9bb0ca" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">+1</text><text x="90" y="148" fill="#83baff" font-size="18" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">1/4</text><text x="180" y="113" fill="#82dfbd" font-size="18" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">1/2</text><text x="270" y="148" fill="#83baff" font-size="18" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">1/4</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">常量 1 滤波后仍为 1</text></svg>