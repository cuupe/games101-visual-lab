<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>两种成像路线</title><desc>蓝色是视线，橙色是光线；光栅化还会把三角形覆盖到像素。</desc><rect width="360" height="264" fill="#0b1421"/><polygon points="50,195 300,195 275,130 82,130" fill="#182d39" stroke="#2a3d55" stroke-width="2" stroke-linejoin="round"/><circle cx="180" cy="133" r="40" fill="#b9a2ff" stroke="none" stroke-width="2"/><rect x="74" y="40" width="48" height="13" rx="0" fill="#f3b47f" stroke="none"/><circle cx="300" cy="95" r="8" fill="#83baff" stroke="none" stroke-width="2"/><line x1="300" y1="95" x2="205" y2="105" stroke="#83baff" stroke-width="2.7"/><polygon points="205,105 212.6,100.18 213.44,108.13" fill="#83baff" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="205" y1="105" x2="100" y2="54" stroke="#f3b47f" stroke-width="2.7"/><polygon points="100,54 109,53.93 105.51,61.12" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="45" y="28" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">灯光</text><text x="180" y="248" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">检查直接光是否被遮挡</text></svg>