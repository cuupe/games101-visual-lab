<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>换成频率坐标</title><desc>两根柱分别表示两个余弦分量的幅度；图中省略对称的负频率。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="72" y="68" width="106" height="135" rx="0" fill="#82dfbd" stroke="none"/><rect x="182" y="155.75" width="106" height="47.25" rx="0" fill="#b9a2ff" stroke="none"/><line x1="70" y1="203" x2="290" y2="203" stroke="#9bb0ca" stroke-width="1.4"/><text x="126" y="225" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">1 Hz</text><text x="235" y="225" fill="#b9a2ff" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">5 Hz</text><text x="125" y="56" fill="#82dfbd" font-size="18" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">1</text><text x="235" y="145" fill="#b9a2ff" font-size="18" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">0.35</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">频谱描述同一信号的另一组坐标</text></svg>