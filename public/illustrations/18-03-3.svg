<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>几何距离近不等于同一表面</title><desc>圆邻域同时覆盖薄纸正反面；背面光子不能无条件贡献正面照明。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="35" y1="114" x2="327" y2="114" stroke="#83baff" stroke-width="4"/><line x1="35" y1="137" x2="327" y2="137" stroke="#b9a2ff" stroke-width="4"/><circle cx="176" cy="114" r="66" fill="none" stroke="#82dfbd" stroke-width="2"/><circle cx="136" cy="110" r="5" fill="#83baff" stroke="none" stroke-width="2"/><circle cx="181" cy="110" r="5" fill="#83baff" stroke="none" stroke-width="2"/><circle cx="214" cy="110" r="5" fill="#83baff" stroke="none" stroke-width="2"/><circle cx="151" cy="141" r="5" fill="#ff8c9f" stroke="none" stroke-width="2"/><circle cx="192" cy="141" r="5" fill="#ff8c9f" stroke="none" stroke-width="2"/><circle cx="224" cy="141" r="5" fill="#ff8c9f" stroke="none" stroke-width="2"/><text x="35" y="74" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">正面光子</text><text x="209" y="194" fill="#ff8c9f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">背面需排除</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">检查法线、表面关系与核函数</text></svg>