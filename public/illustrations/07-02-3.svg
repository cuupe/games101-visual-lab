<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>第三步：拒绝蓝色</title><desc>蓝色深度 0.5 大于已有的 0.3，颜色与深度都保持不变。</desc><rect width="360" height="264" fill="#0b1421"/><text x="26" y="32" fill="#9bb0ca" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">较小的深度更近</text><rect x="45" y="58" width="200" height="36" rx="0" fill="#ff8c9f44" stroke="none"/><text x="57" y="82" fill="#ff8c9f" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">红：z = 0.7</text><rect x="45" y="109" width="200" height="36" rx="0" fill="#82dfbd44" stroke="none"/><text x="57" y="133" fill="#82dfbd" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">绿：z = 0.3</text><rect x="270" y="109" width="40" height="36" rx="0" fill="#82dfbd" stroke="none"/><text x="265" y="47" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">保留</text><rect x="45" y="160" width="200" height="36" rx="0" fill="#83baff44" stroke="none"/><text x="57" y="184" fill="#83baff" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">蓝：z = 0.5</text><text x="270" y="183" fill="#ff8c9f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">拒绝</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">最终绿色；保留最近的 z = 0.3</text></svg>