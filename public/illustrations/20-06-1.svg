<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>直接平均编码值</title><desc>sRGB 黑 0 与白 1 的编码平均是 0.5；用标准分段公式解码，线性光仅约 0.214。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="65" y="58" width="230" height="146" rx="0" fill="#808080" stroke="none"/><text x="20" y="25" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">错误计算域：(0+1)/2</text><text x="180" y="225" fill="#e0eaf7" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">屏幕编码 0.5</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">线性光 ≈ 0.214</text></svg>