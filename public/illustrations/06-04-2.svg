<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>提高采样频率</title><desc>原频谱仍为 B=3 Hz，但副本间隔增大到 8 Hz。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="20" y1="196" x2="337" y2="196" stroke="#9bb0ca" stroke-width="1.5"/><polygon points="337,196 328.94,200 328.94,192" fill="#9bb0ca" stroke="none" stroke-width="2" stroke-linejoin="round"/><polygon points="26,196 68,70 110,196" fill="#b9a2ff66" stroke="#b9a2ff" stroke-width="2" stroke-linejoin="round"/><text x="68" y="219" fill="#b9a2ff" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">-8</text><polygon points="138,196 180,70 222,196" fill="#82dfbd66" stroke="#82dfbd" stroke-width="2" stroke-linejoin="round"/><text x="180" y="219" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">0</text><polygon points="250,196 292,70 334,196" fill="#b9a2ff66" stroke="#b9a2ff" stroke-width="2" stroke-linejoin="round"/><text x="292" y="219" fill="#b9a2ff" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">8</text><text x="25" y="40" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">频谱支撑：−B 到 +B</text><text x="324" y="42" fill="#9bb0ca" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">f</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">fs = 8 &gt; 6，副本不再重叠</text></svg>