<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>最近表面决定可见性</title><desc>同一条主光线穿过两物体，先遇到的交点才写入像素。</desc><rect width="360" height="264" fill="#0b1421"/><path d="M 20 132 Q 35 117 50 132 Q 35 147 20 132" fill="none" stroke="#83baff" stroke-width="2.5"/><circle cx="35" cy="132" r="4" fill="#83baff" stroke="none" stroke-width="2"/><rect x="80" y="99" width="9" height="68" rx="0" fill="#b9a2ff" stroke="none"/><circle cx="161" cy="132" r="27" fill="#82dfbd" stroke="none" stroke-width="2"/><circle cx="267" cy="132" r="35" fill="#142235" stroke="#f3b47f" stroke-width="2"/><line x1="36" y1="132" x2="133" y2="132" stroke="#83baff" stroke-width="2.7"/><polygon points="133,132 124.94,136 124.94,128" fill="#83baff" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="188" y1="132" x2="307" y2="132" stroke="#83baff" stroke-width="2" stroke-dasharray="5 4"/><text x="73" y="91" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">像素</text><text x="115" y="188" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">t=2：可见</text><text x="228" y="191" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">t=5：被挡</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">主光线返回最小合法 t</text></svg>