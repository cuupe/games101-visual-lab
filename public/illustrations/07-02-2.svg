<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>第二步：绿色更近</title><desc>绿色深度 0.3 小于缓冲中的 0.7，因此替换红色。</desc><rect width="360" height="264" fill="#0b1421"/><text x="26" y="32" fill="#9bb0ca" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">较小的深度更近</text><rect x="45" y="58" width="200" height="36" rx="0" fill="#ff8c9f44" stroke="none"/><text x="57" y="82" fill="#ff8c9f" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">红：z = 0.7</text><rect x="45" y="109" width="200" height="36" rx="0" fill="#82dfbd44" stroke="none"/><text x="57" y="133" fill="#82dfbd" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">绿：z = 0.3</text><rect x="270" y="109" width="40" height="36" rx="0" fill="#82dfbd" stroke="none"/><text x="265" y="47" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">保留</text><rect x="45" y="160" width="200" height="36" rx="0" fill="#83baff44" stroke="none"/><text x="57" y="184" fill="#83baff" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">蓝：z = 0.5</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">0.3 &lt; 0.7，缓冲深度变为 0.3</text></svg>