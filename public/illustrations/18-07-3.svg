<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>厚度改变透射和边界条件</title><desc>厚块有更多内部传播空间；薄层的背面与少次散射不能无条件套厚介质近似。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="31" y="73" width="126" height="138" rx="0" fill="#273747" stroke="#83baff"/><rect x="201" y="95" width="126" height="26" rx="0" fill="#273747" stroke="#b9a2ff"/><line x1="62" y1="38" x2="73" y2="82" stroke="#f3b47f" stroke-width="2.7"/><polygon points="73,82 67.17,75.15 74.92,73.21" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><polyline points="73,82 91,147 115,177 136,125" fill="none" stroke="#82dfbd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="235" y1="39" x2="246" y2="103" stroke="#f3b47f" stroke-width="2.7"/><polygon points="246,103 240.7,95.73 248.57,94.38" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="246" y1="103" x2="276" y2="182" stroke="#82dfbd" stroke-width="2.7"/><polygon points="276,182 269.4,175.88 276.87,173.04" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="64" y="229" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">厚块</text><text x="239" y="217" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">薄层</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">扩散近似有尺度与边界适用条件</text></svg>