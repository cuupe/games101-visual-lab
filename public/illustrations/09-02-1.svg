<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>投影改变了参数分布</title><desc>端点属性为 u=0 与 u=1，裁剪 w 分别为 1 与 3；投影前的 u=0.5 出现在屏幕 s=0.75。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="43" y1="128" x2="317" y2="128" stroke="#9bb0ca" stroke-width="4"/><circle cx="43" cy="128" r="6" fill="#83baff" stroke="none" stroke-width="2"/><circle cx="317" cy="128" r="6" fill="#b9a2ff" stroke="none" stroke-width="2"/><circle cx="248.5" cy="128" r="7" fill="#f3b47f" stroke="none" stroke-width="2"/><text x="43" y="83" fill="#83baff" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">w=1</text><text x="317" y="83" fill="#b9a2ff" font-size="17" text-anchor="end" font-family="Arial,Microsoft YaHei,sans-serif">w=3</text><text x="226" y="164" fill="#f3b47f" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">u=0.5</text><text x="180" y="35" fill="#e0eaf7" font-size="18" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">屏幕参数 s</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">u=0.5 的位置：s = 0.75</text></svg>