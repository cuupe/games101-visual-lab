<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>历史失效：新露出的背景</title><desc>紫色虚线是历史物体位置，绿色是当前位置；旧位置已变成背景，不能继续直接混合。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="32" y="55" width="296" height="157" rx="0" fill="#142235" stroke="none"/><rect x="77" y="78" width="75" height="103" rx="0" fill="none" stroke="#b9a2ff"/><line x1="77" y1="78" x2="152" y2="78" stroke="#b9a2ff" stroke-width="2" stroke-dasharray="5 4"/><rect x="172" y="78" width="75" height="103" rx="0" fill="#82dfbd" stroke="none"/><line x1="130" y1="42" x2="210" y2="42" stroke="#f3b47f" stroke-width="2.7"/><polygon points="210,42 201.94,46 201.94,38" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="35" y="202" fill="#b9a2ff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">新露背景</text><text x="183" y="202" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">当前物体</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">运动重投影需要检测历史有效性</text></svg>