<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>半程向量选出有效微面</title><desc>wi 和 wo 都从表面指向外部，只有法线为半程方向的微面匹配这对方向。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="28" y1="194" x2="332" y2="194" stroke="#83baff" stroke-width="4"/><line x1="177" y1="194" x2="61" y2="84" stroke="#83baff" stroke-width="2.7"/><polygon points="61,84 69.6,86.65 64.1,92.45" fill="#83baff" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="177" y1="194" x2="288" y2="68" stroke="#f3b47f" stroke-width="2.7"/><polygon points="288,68 285.67,76.69 279.67,71.41" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="177" y1="194" x2="170" y2="48" stroke="#82dfbd" stroke-width="2.7"/><polygon points="170,48 174.38,55.86 166.4,56.25" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="139" y1="196" x2="215" y2="191" stroke="#b9a2ff" stroke-width="6"/><text x="30" y="76" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">ωᵢ</text><text x="290" y="59" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">ωₒ</text><text x="179" y="53" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">h</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">h = normalize(ωᵢ + ωₒ)</text></svg>