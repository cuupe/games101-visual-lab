<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>不补偿会系统性变暗</title><desc>存活后仍返回 .6，会使期望降为 .15，不能靠更多样本修复。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="82" y="111.2" width="97.5" height="79.8" rx="0" fill="#82dfbd" stroke="none"/><rect x="183.5" y="171.05" width="97.5" height="19.95" rx="0" fill="#ff8c9f" stroke="none"/><line x1="80" y1="191" x2="283" y2="191" stroke="#9bb0ca" stroke-width="1.4"/><text x="80" y="219" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">正确期望</text><text x="206" y="219" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">未补偿</text><text x="76" y="47" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">.60</text><text x="209" y="144" fill="#ff8c9f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">.15</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">错误期望 qC=.25×.6=.15</text></svg>