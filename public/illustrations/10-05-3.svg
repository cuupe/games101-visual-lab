<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>差集：保留 A，挖掉 B</title><desc>绿色只保留左圆内部且右圆外部；B 的符号取反后参与 max。</desc><rect width="360" height="264" fill="#0b1421"/><defs><mask id="subtractB"><rect width="360" height="264" fill="white"/><circle cx="225" cy="125" r="64" fill="black"/></mask></defs><circle cx="135" cy="125" r="64" fill="none" stroke="#83baff" stroke-width="2"/><circle cx="225" cy="125" r="64" fill="none" stroke="#b9a2ff" stroke-width="2"/><g mask="url(#subtractB)"><circle cx="135" cy="125" r="64" fill="#82dfbdbb" stroke="none" stroke-width="2"/></g><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">A−B：max(fA,−fB)</text></svg>