<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>右侧：蓝色更近</title><desc>两条深度曲线相交后，右侧蓝线深度较小，排序与左侧相反。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="40" y1="40" x2="40" y2="207" stroke="#9bb0ca" stroke-width="1.5"/><polygon points="40,207 36,198.94 44,198.94" fill="#9bb0ca" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="40" y1="210" x2="325" y2="210" stroke="#9bb0ca" stroke-width="1.5"/><polygon points="325,210 316.94,214 316.94,206" fill="#9bb0ca" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="52" y="35" fill="#9bb0ca" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">z：下方更远</text><text x="320" y="229" fill="#9bb0ca" font-size="16" text-anchor="end" font-family="Arial,Microsoft YaHei,sans-serif">屏幕 x</text><line x1="58" y1="68" x2="300" y2="185" stroke="#ff8c9f" stroke-width="4"/><line x1="58" y1="185" x2="300" y2="68" stroke="#83baff" stroke-width="4"/><line x1="270" y1="55" x2="270" y2="200" stroke="#f3b47f" stroke-width="2" stroke-dasharray="5 4"/><text x="174" y="91" fill="#83baff" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">蓝更近</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">右侧需要先红后蓝</text></svg>