<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>垂直视场</title><desc>固定传感器高度时，焦距和视场角通过正切关系联系。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="45" y1="145" x2="183.56" y2="145" stroke="#9bb0ca" stroke-width="2.7"/><polygon points="183.56,145 175.5,149 175.5,141" fill="#9bb0ca" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="45" y1="145" x2="183.56" y2="65" stroke="#82dfbd" stroke-width="2"/><line x1="45" y1="145" x2="183.56" y2="225" stroke="#82dfbd" stroke-width="2"/><line x1="183.56" y1="65" x2="183.56" y2="225" stroke="#b9a2ff" stroke-width="3"/><text x="72" y="112" fill="#82dfbd" font-size="22" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">60°</text><text x="231" y="138" fill="#b9a2ff" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">传感器</text><text x="180" y="248" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">固定画幅：焦距越短，视场越大</text></svg>