<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>逐跳贡献叠加</title><desc>示例贡献随跳数减小，但是否可忽略取决于材质、遮挡和目标误差。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="50" y="134.5" width="64.25" height="64.5" rx="0" fill="#f3b47f" stroke="none"/><rect x="118.25" y="173.2" width="64.25" height="25.8" rx="0" fill="#ff8c9f" stroke="none"/><rect x="186.5" y="188.68" width="64.25" height="10.32" rx="0" fill="#b9a2ff" stroke="none"/><rect x="254.75" y="194.87" width="64.25" height="4.13" rx="0" fill="#83baff" stroke="none"/><line x1="48" y1="199" x2="321" y2="199" stroke="#9bb0ca" stroke-width="1.4"/><text x="54" y="222" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">直接</text><text x="124" y="222" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">二跳</text><text x="192" y="222" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">三跳</text><text x="261" y="222" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">四跳</text><text x="41" y="49" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">示例贡献 .50/.20/.08/.032</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">更多样本不能补回被截断的路径</text></svg>