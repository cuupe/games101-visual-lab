<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>同时比较偏差、方差与成本</title><desc>示例 A 无偏但方差 .09；B 偏差 .2、方差 .01，总误差仍要合并判断。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="60" y="179.12" width="59.75" height="11.88" rx="0" fill="#83baff" stroke="none"/><rect x="123.75" y="189.68" width="59.75" height="1.32" rx="0" fill="#b9a2ff" stroke="none"/><rect x="187.5" y="185.72" width="59.75" height="5.28" rx="0" fill="#f3b47f" stroke="none"/><rect x="251.25" y="184.4" width="59.75" height="6.6" rx="0" fill="#82dfbd" stroke="none"/><line x1="58" y1="191" x2="313" y2="191" stroke="#9bb0ca" stroke-width="1.4"/><text x="42" y="217" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">A方差</text><text x="105" y="217" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">B方差</text><text x="169" y="217" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">偏差²</text><text x="245" y="217" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">B总计</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">MSE(A)=.09，MSE(B)=.05</text></svg>