<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>用灯的投影面积换算方向域</title><desc>小片法线与视线约夹 60°，投影面积约减半；距离不变时张角也近似减半。</desc><rect width="360" height="264" fill="#0b1421"/><circle cx="42" cy="181" r="4" fill="#83baff" stroke="none" stroke-width="2"/><text x="49" y="173" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">p</text><polygon points="302,70 322,78 252,155 232,147" fill="#142235" stroke="#f3b47f" stroke-width="2" stroke-linejoin="round"/><line x1="42" y1="181" x2="302" y2="70" stroke="#9bb0ca" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="42" y1="181" x2="232" y2="147" stroke="#9bb0ca" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="205" y1="100" x2="221" y2="150" stroke="#82dfbd" stroke-width="5"/><line x1="205" y1="100" x2="302" y2="70" stroke="#82dfbd" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="221" y1="150" x2="232" y2="147" stroke="#82dfbd" stroke-width="1.2" stroke-dasharray="4 4"/><text x="172" y="205" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">A⊥≈A cos60°</text><text x="251" y="185" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">灯片</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">小片近似：Ω≈.5 A/r²</text></svg>