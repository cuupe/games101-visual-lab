<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>逆向有多种解释</title><desc>近小与远大可具有相同高度/距离比，投影不能唯一恢复场景。</desc><rect width="360" height="264" fill="#0b1421"/><circle cx="30" cy="145" r="5" fill="#f3b47f" stroke="none" stroke-width="2"/><line x1="30" y1="145" x2="230" y2="105" stroke="#9bb0ca" stroke-width="2"/><line x1="30" y1="145" x2="230" y2="185" stroke="#9bb0ca" stroke-width="2"/><line x1="130" y1="125" x2="130" y2="165" stroke="#82dfbd" stroke-width="8"/><line x1="230" y1="105" x2="230" y2="185" stroke="#b9a2ff" stroke-width="8"/><text x="92" y="91" fill="#82dfbd" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">近、小</text><text x="207" y="74" fill="#b9a2ff" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">远、大</text><text x="180" y="248" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">高度 / 距离相同 → 投影相同</text></svg>