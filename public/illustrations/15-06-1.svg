<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>离散随机变量的期望</title><desc>两个结果的概率不同，期望需按概率加权，而非简单平均结果。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="73" y="142.5" width="106.5" height="27.5" rx="0" fill="#83baff" stroke="none"/><rect x="183.5" y="87.5" width="106.5" height="82.5" rx="0" fill="#f3b47f" stroke="none"/><line x1="71" y1="170" x2="292" y2="170" stroke="#9bb0ca" stroke-width="1.4"/><text x="64" y="197" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">X=0</text><text x="210" y="197" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">X=4</text><text x="66" y="97" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">p=.25</text><text x="210" y="50" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">p=.75</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">E[X]=0×.25+4×.75=3</text></svg>