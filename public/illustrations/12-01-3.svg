<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>重网格化：改善三角形质量</title><desc>同一四边形保持四个顶点，灰色虚线与绿色线是两种对角连接；绿色方案提高了最小角。</desc><rect width="360" height="264" fill="#0b1421"/><polygon points="65,65 280,85 230,205 105,145" fill="#142235" stroke="#9bb0ca" stroke-width="2" stroke-linejoin="round"/><line x1="65" y1="65" x2="230" y2="205" stroke="#9bb0ca" stroke-width="2" stroke-dasharray="5 4"/><line x1="280" y1="85" x2="105" y2="145" stroke="#82dfbd" stroke-width="3"/><text x="180" y="34" fill="#e0eaf7" font-size="18" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">边翻转改变元素形状</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">最小角：14.7° → 24.2°</text></svg>