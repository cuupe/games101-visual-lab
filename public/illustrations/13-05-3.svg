<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>方向分量为零要分支</title><desc>光线的 x 坐标始终为 2，永远不进入盒的 x∈[−1,1]。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="56" y="63" width="146" height="132" rx="0" fill="#142235" stroke="#83baff"/><line x1="274" y1="204" x2="274" y2="46" stroke="#f3b47f" stroke-width="2.7"/><polygon points="274,46 278,54.06 270,54.06" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="78" y="98" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">x∈[−1,1]</text><text x="239" y="133" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">x=2</text><text x="220" y="180" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">dₓ=0</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">平行且原点在 slab 外：无交</text></svg>