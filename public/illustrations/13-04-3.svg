<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>平面交点位于边外</title><desc>点的 u+v 大于 1，超出 BC 边；t&gt;0 仍不能使它成为三角形交点。</desc><rect width="360" height="264" fill="#0b1421"/><polygon points="62,192 310,192 62,50" fill="#142235" stroke="#83baff" stroke-width="2" stroke-linejoin="round"/><line x1="62" y1="50" x2="310" y2="192" stroke="#f3b47f" stroke-width="4"/><circle cx="211" cy="107" r="4" fill="#ff8c9f" stroke="none" stroke-width="2"/><text x="218" y="99" fill="#ff8c9f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">P</text><text x="143" y="52" fill="#ff8c9f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">u=.6，v=.6</text><line x1="211" y1="107" x2="162" y2="135" stroke="#ff8c9f" stroke-width="2" stroke-dasharray="4 4"/><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">A 权重=−.2：拒绝命中</text></svg>