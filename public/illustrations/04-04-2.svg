<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>物距 z=4</title><desc>物距翻倍，投影高度变为一半。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="25" y1="142" x2="340" y2="142" stroke="#2a3d55" stroke-width="1" stroke-dasharray="5 4"/><circle cx="35" cy="142" r="5" fill="#f3b47f" stroke="none" stroke-width="2"/><line x1="110" y1="42" x2="110" y2="225" stroke="#b9a2ff" stroke-width="3"/><line x1="335" y1="100" x2="335" y2="184" stroke="#83baff" stroke-width="5"/><line x1="35" y1="142" x2="335" y2="100" stroke="#82dfbd" stroke-width="1.8"/><line x1="35" y1="142" x2="335" y2="184" stroke="#82dfbd" stroke-width="1.8"/><line x1="110" y1="131.5" x2="110" y2="152.5" stroke="#82dfbd" stroke-width="6"/><text x="70" y="32" fill="#b9a2ff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">虚拟像平面</text><text x="285" y="80" fill="#83baff" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">z=4</text><text x="122" y="138.5" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">投影</text><text x="180" y="248" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">同一物体：投影高度 ∝ 1/z</text></svg>