<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>实时 30 FPS</title><desc>约 33.3 ms 每帧对应约 30 FPS，可以投入更多计算。</desc><rect width="360" height="264" fill="#0b1421"/><text x="35" y="42" fill="#e0eaf7" font-size="20" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">单帧预算 33.3 ms</text><line x1="35" y1="206" x2="325" y2="206" stroke="#9bb0ca" stroke-width="2"/><rect x="38" y="82" width="67.5" height="104" rx="0" fill="#82dfbd" stroke="none"/><rect x="109.25" y="82" width="67.5" height="104" rx="0" fill="#b9a2ff" stroke="none"/><rect x="180.5" y="82" width="67.5" height="104" rx="0" fill="#82dfbd" stroke="none"/><rect x="251.75" y="82" width="67.5" height="104" rx="0" fill="#b9a2ff" stroke="none"/><text x="180" y="223" fill="#9bb0ca" font-size="15" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">每块代表一项计算开销</text><text x="180" y="248" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">约 30 帧 / 秒</text></svg>