<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>球面积除以半径平方</title><desc>同一个方向锥投到更大球面，面积按 r² 增大而立体角不变。</desc><rect width="360" height="264" fill="#0b1421"/><circle cx="44" cy="174" r="5" fill="#f3b47f" stroke="none" stroke-width="2"/><path d="M 96.34 100.83 A 90 90 0 0 1 133.89 178.5" fill="none" stroke="#83baff" stroke-width="2.5"/><path d="M 148.68 27.66 A 180 180 0 0 1 223.78 183" fill="none" stroke="#b9a2ff" stroke-width="2.5"/><line x1="44" y1="174" x2="148.68" y2="27.66" stroke="#82dfbd" stroke-width="2.7"/><polygon points="148.68,27.66 147.24,36.54 140.74,31.89" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="44" y1="174" x2="223.78" y2="183" stroke="#82dfbd" stroke-width="2.7"/><polygon points="223.78,183 215.53,186.59 215.93,178.61" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="99" y="211" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">r=1</text><text x="237" y="221" fill="#b9a2ff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">r=2</text><text x="173" y="104" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">同一个方向锥</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">A 增为 4 倍，Ω=A/r² 不变</text></svg>