<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>在线性空间叠加能量</title><desc>两份线性亮度 0.25 相加得到 0.5；显示编码在求和完成后执行。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="30" y="73" width="85" height="86" rx="0" fill="#898989" stroke="none"/><text x="72" y="189" fill="#9bb0ca" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">线性 .25</text><text x="130" y="123" fill="#e0eaf7" font-size="22" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">+</text><rect x="147" y="73" width="85" height="86" rx="0" fill="#898989" stroke="none"/><text x="189" y="189" fill="#9bb0ca" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">线性 .25</text><text x="248" y="123" fill="#e0eaf7" font-size="22" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">=</text><rect x="269" y="73" width="67" height="86" rx="0" fill="#bbbbbb" stroke="none"/><text x="302" y="189" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">.50</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">线性相加后编码：0.5 → sRGB 0.735</text></svg>