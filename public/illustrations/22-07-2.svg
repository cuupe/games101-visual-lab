<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>MPM：粒子到网格 P2G</title><desc>简化两节点权重 0.25 与 0.75，质量 2 kg、速度 3 m/s。节点分别得到质量 0.5、1.5，动量 1.5、4.5。</desc><rect width="360" height="264" fill="#0b1421"/><circle cx="180" cy="78" r="14" fill="#f3b47f" stroke="none" stroke-width="2"/><text x="180" y="40" fill="#f3b47f" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">粒子 m=2，mv=6</text><line x1="169" y1="95" x2="84" y2="143" stroke="#83baff" stroke-width="2.7"/><polygon points="84,143 89.06,135.56 92.99,142.51" fill="#83baff" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="192" y1="95" x2="277" y2="143" stroke="#82dfbd" stroke-width="2.7"/><polygon points="277,143 268.01,142.51 271.94,135.56" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><rect x="40" y="157" width="95" height="44" rx="0" fill="#142235" stroke="#83baff"/><rect x="223" y="157" width="96" height="44" rx="0" fill="#142235" stroke="#82dfbd"/><text x="87" y="184" fill="#83baff" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">w=0.25</text><text x="271" y="184" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">w=0.75</text><text x="24" y="224" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">m=0.5，p=1.5</text><text x="205" y="224" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">m=1.5，p=4.5</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">Σw=1 → Σm=2，Σp=6</text></svg>