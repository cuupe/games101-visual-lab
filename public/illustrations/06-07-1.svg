<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>FXAA：局部后处理</title><desc>示意阶梯边经过局部平滑；方法读取已有像素，不会重新查询几何。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="38" y="70" width="25" height="145" rx="0" fill="#82dfbd" stroke="none"/><rect x="63" y="86" width="25" height="129" rx="0" fill="#82dfbd" stroke="none"/><rect x="88" y="102" width="25" height="113" rx="0" fill="#82dfbd" stroke="none"/><rect x="113" y="118" width="25" height="97" rx="0" fill="#82dfbd" stroke="none"/><rect x="138" y="134" width="25" height="81" rx="0" fill="#82dfbd" stroke="none"/><rect x="163" y="150" width="25" height="65" rx="0" fill="#82dfbd" stroke="none"/><line x1="202" y1="140" x2="230" y2="140" stroke="#f3b47f" stroke-width="2.7"/><polygon points="230,140 221.94,144 221.94,136" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M 246 215 L 246 146 Q 267 123 281 101 Q 296 84 323 71 L 323 215 Z" fill="#82dfbd88" stroke="#82dfbd" stroke-width="2"/><text x="32" y="34" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">已有像素 → 检测边缘</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">减少锯齿，但可能丢失清晰细节</text></svg>