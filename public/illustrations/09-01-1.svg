<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>顶点 A：全部权重给 A</title><desc>P 与 A 重合，对边 B–C 的子三角形等于整个三角形；另外两块面积为零。</desc><rect width="360" height="264" fill="#0b1421"/><polygon points="65,205 300,205 140,48" fill="#142235" stroke="#9bb0ca" stroke-width="2" stroke-linejoin="round"/><polygon points="65,205 300,205 140,48" fill="#ff8c9f66" stroke="#ff8c9f" stroke-width="2" stroke-linejoin="round"/><polygon points="65,205 140,48 65,205" fill="#82dfbd66" stroke="#82dfbd" stroke-width="2" stroke-linejoin="round"/><polygon points="65,205 65,205 300,205" fill="#83baff66" stroke="#83baff" stroke-width="2" stroke-linejoin="round"/><circle cx="65" cy="205" r="5" fill="#e0eaf7" stroke="none" stroke-width="2"/><text x="45" y="219" fill="#ff8c9f" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">A</text><text x="306" y="219" fill="#82dfbd" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">B</text><text x="135" y="35" fill="#83baff" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">C</text><text x="73" y="199" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">P</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">(α,β,γ) = (1,0,0)</text></svg>