<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>均值可以增量更新</title><desc>样本依次为 1、3、2，累计平均为 1、2、2，无需保存全部历史。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="72" y="136.5" width="68.67" height="57.5" rx="0" fill="#83baff" stroke="none"/><rect x="144.67" y="79" width="68.67" height="115" rx="0" fill="#82dfbd" stroke="none"/><rect x="217.33" y="79" width="68.67" height="115" rx="0" fill="#b9a2ff" stroke="none"/><line x1="70" y1="194" x2="288" y2="194" stroke="#9bb0ca" stroke-width="1.4"/><text x="76" y="222" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">n=1</text><text x="152" y="222" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">n=2</text><text x="223" y="222" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">n=3</text><text x="42" y="50" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">新样本：1 → 3 → 2</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">Cₙ=Cₙ₋₁+(Xₙ−Cₙ₋₁)/n</text></svg>