<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>观测到轮廓</title><desc>图像只保存观察方向上的信息，背面信息可能丢失。</desc><rect width="360" height="264" fill="#0b1421"/><polygon points="130,60 225,60 225,198 130,198" fill="#82dfbd" stroke="#82dfbd" stroke-width="2" stroke-linejoin="round"/><text x="180" y="248" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">单张图像只有一个视角</text></svg>