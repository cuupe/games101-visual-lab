<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>离线单帧</title><desc>离线可以扩大单帧预算，但实际成本也受场景和算法影响。</desc><rect width="360" height="264" fill="#0b1421"/><text x="35" y="42" fill="#e0eaf7" font-size="20" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">单帧预算 1000 ms</text><line x1="35" y1="206" x2="325" y2="206" stroke="#9bb0ca" stroke-width="2"/><rect x="38" y="82" width="15.8" height="104" rx="0" fill="#82dfbd" stroke="none"/><rect x="57" y="82" width="15.8" height="104" rx="0" fill="#b9a2ff" stroke="none"/><rect x="76" y="82" width="15.8" height="104" rx="0" fill="#82dfbd" stroke="none"/><rect x="95" y="82" width="15.8" height="104" rx="0" fill="#b9a2ff" stroke="none"/><rect x="114" y="82" width="15.8" height="104" rx="0" fill="#82dfbd" stroke="none"/><rect x="133" y="82" width="15.8" height="104" rx="0" fill="#b9a2ff" stroke="none"/><rect x="152" y="82" width="15.8" height="104" rx="0" fill="#82dfbd" stroke="none"/><rect x="171" y="82" width="15.8" height="104" rx="0" fill="#b9a2ff" stroke="none"/><rect x="190" y="82" width="15.8" height="104" rx="0" fill="#82dfbd" stroke="none"/><rect x="209" y="82" width="15.8" height="104" rx="0" fill="#b9a2ff" stroke="none"/><rect x="228" y="82" width="15.8" height="104" rx="0" fill="#82dfbd" stroke="none"/><rect x="247" y="82" width="15.8" height="104" rx="0" fill="#b9a2ff" stroke="none"/><rect x="266" y="82" width="15.8" height="104" rx="0" fill="#82dfbd" stroke="none"/><rect x="285" y="82" width="15.8" height="104" rx="0" fill="#b9a2ff" stroke="none"/><rect x="304" y="82" width="15.8" height="104" rx="0" fill="#82dfbd" stroke="none"/><text x="180" y="223" fill="#9bb0ca" font-size="15" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">每块代表一项计算开销</text><text x="180" y="248" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">约 1 帧 / 秒</text></svg>