<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>减色：逐波段透射</title><desc>理想滤色示意：青透射 [0,1,1]、黄透射 [1,1,0]，逐项相乘得到 [0,1,0]。实际油墨更复杂。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="34" y="70" width="85" height="95" rx="0" fill="#00ffff" stroke="none"/><text x="132" y="123" fill="#e0eaf7" font-size="24" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">×</text><rect x="166" y="70" width="85" height="95" rx="0" fill="#ffff00" stroke="none"/><text x="271" y="123" fill="#e0eaf7" font-size="24" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">=</text><rect x="301" y="70" width="37" height="95" rx="0" fill="#00ff00" stroke="none"/><text x="20" y="28" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">青滤色 × 黄滤色</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">从白光减去被吸收波段</text></svg>