<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>奇异约束：最优点不唯一</title><desc>只有 y=0 约束时，绿色整条线上误差均为零；不能假装矩阵总可逆。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="32" y1="143" x2="328" y2="143" stroke="#82dfbd" stroke-width="4"/><circle cx="85" cy="143" r="7" fill="#f3b47f" stroke="none" stroke-width="2"/><circle cx="180" cy="143" r="7" fill="#f3b47f" stroke="none" stroke-width="2"/><circle cx="275" cy="143" r="7" fill="#f3b47f" stroke="none" stroke-width="2"/><line x1="180" y1="92" x2="180" y2="143" stroke="#83baff" stroke-width="2.7"/><polygon points="180,143 176,134.94 184,134.94" fill="#83baff" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="180" y="51" fill="#e0eaf7" font-size="18" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">E = y²，与 x 无关</text><text x="180" y="206" fill="#9bb0ca" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">端点、中点等候选需比较</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">还要检查拓扑合法性与翻面</text></svg>