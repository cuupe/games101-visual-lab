<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>先发现 t=8，仍要检查 t=3</title><desc>左盒入口更早，但里面物体更远；右侧实际交点更近。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="73" y="55" width="227" height="49" rx="0" fill="none" stroke="#83baff"/><rect x="105" y="119" width="87" height="49" rx="0" fill="none" stroke="#b9a2ff"/><line x1="29" y1="190" x2="327" y2="190" stroke="#82dfbd" stroke-width="2.7"/><polygon points="327,190 318.94,194 318.94,186" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="73" y1="104" x2="73" y2="194" stroke="#83baff" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="105" y1="168" x2="105" y2="194" stroke="#b9a2ff" stroke-width="1.4" stroke-dasharray="5 4"/><text x="89" y="84" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">入口 1；交点 8</text><text x="117" y="149" fill="#b9a2ff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">2 → 3</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">第一个命中不等于最近命中</text></svg>