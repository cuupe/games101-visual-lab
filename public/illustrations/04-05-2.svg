<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>宽高比</title><desc>相同垂直视场，宽画幅能看到更宽的水平方向。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="36" y="60" width="288" height="162" rx="0" fill="#163442" stroke="#82dfbd"/><rect x="68" y="45" width="224" height="168" rx="0" fill="none" stroke="#f3b47f"/><text x="180" y="31" fill="#e0eaf7" font-size="18" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">同一垂直 FOV 的画幅</text><text x="80" y="100" fill="#f3b47f" font-size="19" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">4 : 3</text><text x="236" y="190" fill="#82dfbd" font-size="19" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">16 : 9</text><text x="180" y="248" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">宽高比改变水平方向覆盖</text></svg>