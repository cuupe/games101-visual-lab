<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>移动对象后重新包围</title><desc>同一对象集合运动后可更新盒边界，正确性与分组效率分别检查。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="32" y="59" width="119" height="112" rx="0" fill="none" stroke="#83baff"/><circle cx="55" cy="80" r="11" fill="#83baff" stroke="none" stroke-width="2"/><circle cx="118" cy="143" r="11" fill="#83baff" stroke="none" stroke-width="2"/><line x1="165" y1="116" x2="194" y2="116" stroke="#82dfbd" stroke-width="2.7"/><polygon points="194,116 185.94,120 185.94,112" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><rect x="215" y="50" width="113" height="151" rx="0" fill="none" stroke="#b9a2ff"/><circle cx="234" cy="74" r="11" fill="#b9a2ff" stroke="none" stroke-width="2"/><circle cx="310" cy="188" r="11" fill="#b9a2ff" stroke="none" stroke-width="2"/><text x="41" y="210" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">运动前</text><text x="229" y="224" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">运动后</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">重新包围不保证树仍高效</text></svg>