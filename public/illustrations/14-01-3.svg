<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>候选命中可能在下一格</title><desc>长三角形在第一格登记，但实际交点晚于该格出口。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="39" y1="61" x2="39" y2="187" stroke="#2a3d55" stroke-width="0.65"/><line x1="109" y1="61" x2="109" y2="187" stroke="#2a3d55" stroke-width="0.65"/><line x1="179" y1="61" x2="179" y2="187" stroke="#2a3d55" stroke-width="0.65"/><line x1="249" y1="61" x2="249" y2="187" stroke="#2a3d55" stroke-width="0.65"/><line x1="319" y1="61" x2="319" y2="187" stroke="#2a3d55" stroke-width="0.65"/><line x1="39" y1="61" x2="319" y2="61" stroke="#2a3d55" stroke-width="0.65"/><line x1="39" y1="131" x2="319" y2="131" stroke="#2a3d55" stroke-width="0.65"/><polygon points="51,175 266,80 313,179" fill="none" stroke="#b9a2ff" stroke-width="2" stroke-linejoin="round"/><line x1="26" y1="137" x2="333" y2="137" stroke="#82dfbd" stroke-width="2.7"/><polygon points="333,137 324.94,141 324.94,133" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><circle cx="137" cy="137" r="5" fill="#f3b47f" stroke="none" stroke-width="2"/><line x1="109" y1="54" x2="109" y2="201" stroke="#83baff" stroke-width="2" stroke-dasharray="5 4"/><text x="63" y="46" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">格出口 t=2</text><text x="154" y="214" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">命中 t=2.4</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">t_hit &gt; t_exit：必须继续遍历</text></svg>