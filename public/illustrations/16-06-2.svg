<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>MIS 权重合为 1</title><desc>对同一完整路径的多个生成策略按正确 PDF 分配权重。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="40" y="67" width="278" height="45" rx="5" fill="#142235" stroke="#82dfbd"/><rect x="40" y="141" width="278" height="45" rx="5" fill="#142235" stroke="#b9a2ff"/><text x="65" y="96" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">策略 A：贡献 × wA</text><text x="65" y="170" fill="#b9a2ff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">策略 B：贡献 × wB</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">同路径：wA + wB = 1</text></svg>