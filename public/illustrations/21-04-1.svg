<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>共同平移无内部阻尼</title><desc>端点速度均为 3 m/s；差为零，内部弹簧阻尼为零，全局 −cv 阻尼却非零。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="65" y1="140" x2="275" y2="140" stroke="#82dfbd" stroke-width="3"/><circle cx="65" cy="140" r="9" fill="#83baff" stroke="none" stroke-width="2"/><circle cx="275" cy="140" r="9" fill="#f3b47f" stroke="none" stroke-width="2"/><line x1="65" y1="105" x2="126" y2="105" stroke="#83baff" stroke-width="2.7"/><polygon points="126,105 117.94,109 117.94,101" fill="#83baff" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="275" y1="105" x2="336" y2="105" stroke="#f3b47f" stroke-width="2.7"/><polygon points="336,105 327.94,109 327.94,101" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="20" y="45" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">vₐ=vᵦ=(3,0)</text><text x="85" y="193" fill="#9bb0ca" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">vᵦ−vₐ=0</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">内部阻尼不阻止共同平移</text></svg>