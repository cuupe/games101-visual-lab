<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>18 mm / 50 mm</title><desc>保持机位与焦距，只截取较小感光面；裁切不等于移动相机。</desc><rect width="360" height="264" fill="#0b1421"/><text x="24" y="26" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">f=50 mm，s=18 mm</text><line x1="45" y1="132" x2="320" y2="132" stroke="#2a3d55" stroke-width="1" stroke-dasharray="4 4"/><polygon points="65,132 265,96 265,168" fill="#142235" stroke="#82dfbd" stroke-width="2" stroke-linejoin="round"/><circle cx="65" cy="132" r="5" fill="#f3b47f" stroke="none" stroke-width="2"/><line x1="265" y1="96" x2="265" y2="168" stroke="#83baff" stroke-width="4"/><text x="275" y="132" fill="#83baff" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">s</text><text x="165" y="154" fill="#f3b47f" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">f</text><text x="72" y="86" fill="#82dfbd" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">20.41°</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">水平 FOV ≈ 20.41°</text></svg>