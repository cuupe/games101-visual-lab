<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>重定向：同角度不同接触</title><desc>两组腿长不同但角度相同，根位置相同；短腿脚离地，需要接触约束与 IK 调整。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="25" y1="205" x2="335" y2="205" stroke="#9bb0ca" stroke-width="3"/><polyline points="95,55 135,130 95,205" fill="none" stroke="#83baff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polyline points="245,55 277,115 245,175" fill="none" stroke="#f3b47f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="95" cy="205" r="7" fill="#83baff" stroke="none" stroke-width="2"/><circle cx="245" cy="175" r="7" fill="#f3b47f" stroke="none" stroke-width="2"/><line x1="245" y1="180" x2="245" y2="201" stroke="#b9a2ff" stroke-width="2.7"/><polygon points="245,201 241,192.94 249,192.94" fill="#b9a2ff" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="30" y="28" fill="#83baff" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">长腿演员</text><text x="215" y="28" fill="#f3b47f" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">短腿角色</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">复制角度不保证脚掌落地</text></svg>