<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>仅边弹簧抵抗不了剪切</title><desc>橙色菱形四条边均长 90，相比绿色正方形对角线改变；加入斜向连接产生恢复剪切的力。</desc><rect width="360" height="264" fill="#0b1421"/><polygon points="65,65 155,65 155,155 65,155" fill="none" stroke="#82dfbd" stroke-width="2" stroke-linejoin="round"/><polygon points="214,65 304,65 340,147.49 250,147.49" fill="none" stroke="#f3b47f" stroke-width="2" stroke-linejoin="round"/><line x1="214" y1="65" x2="340" y2="147.49" stroke="#b9a2ff" stroke-width="2" stroke-dasharray="4 4"/><text x="40" y="201" fill="#82dfbd" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">边长不变</text><text x="213" y="201" fill="#b9a2ff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">对角线改变</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">结构连接决定变形刚度</text></svg>