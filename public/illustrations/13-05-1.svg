<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>相交区间逐轴求交</title><desc>每条色带是射线留在该轴范围内的参数区间。</desc><rect width="360" height="264" fill="#0b1421"/><text x="180" y="25" fill="#9bb0ca" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">每个轴给出一个 t 区间</text><line x1="55" y1="74" x2="315" y2="74" stroke="#2a3d55" stroke-width="2"/><line x1="92" y1="74" x2="240" y2="74" stroke="#83baff" stroke-width="8"/><text x="18" y="79" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">x</text><text x="88" y="61" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">1</text><text x="236" y="61" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">5</text><line x1="55" y1="119" x2="315" y2="119" stroke="#2a3d55" stroke-width="2"/><line x1="129" y1="119" x2="203" y2="119" stroke="#b9a2ff" stroke-width="8"/><text x="18" y="124" fill="#b9a2ff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">y</text><text x="125" y="106" fill="#b9a2ff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">2</text><text x="199" y="106" fill="#b9a2ff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">4</text><line x1="55" y1="164" x2="315" y2="164" stroke="#2a3d55" stroke-width="2"/><line x1="166" y1="164" x2="277" y2="164" stroke="#f3b47f" stroke-width="8"/><text x="18" y="169" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">z</text><text x="162" y="151" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">3</text><text x="273" y="151" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">6</text><line x1="166" y1="195" x2="203" y2="195" stroke="#82dfbd" stroke-width="9"/><text x="164" y="221" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">交集 [3,4]</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">进入=max(1,2,3)=3</text></svg>