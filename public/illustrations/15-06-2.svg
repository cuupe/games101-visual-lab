<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>均匀密度依赖区间长度</title><desc>在 [0,2] 均匀采样，密度为 .5，矩形积分为 1。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="61" y="104" width="241" height="86" rx="0" fill="#274a48" stroke="#82dfbd"/><line x1="61" y1="190" x2="324" y2="190" stroke="#9bb0ca" stroke-width="2"/><line x1="61" y1="190" x2="61" y2="58" stroke="#9bb0ca" stroke-width="2"/><text x="21" y="110" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">.5</text><text x="52" y="218" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">0</text><text x="293" y="218" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">2</text><text x="181" y="155" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">概率 = 密度 × 长度</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">∫₀² p(x) dx = .5×2 = 1</text></svg>