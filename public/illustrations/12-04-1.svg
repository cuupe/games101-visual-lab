<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>平面误差：两个正交约束</title><desc>用二维截面展示 x=0 与 y=0 两个单位平面；误差为 E=x²+y²，交点误差为零。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="180" y1="36" x2="180" y2="211" stroke="#83baff" stroke-width="3"/><line x1="38" y1="150" x2="322" y2="150" stroke="#b9a2ff" stroke-width="3"/><circle cx="180" cy="150" r="7" fill="#82dfbd" stroke="none" stroke-width="2"/><text x="197" y="52" fill="#83baff" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">x=0</text><text x="268" y="179" fill="#b9a2ff" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">y=0</text><circle cx="251" cy="80" r="6" fill="#f3b47f" stroke="none" stroke-width="2"/><line x1="251" y1="80" x2="180" y2="80" stroke="#83baff" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="251" y1="80" x2="251" y2="150" stroke="#b9a2ff" stroke-width="1.5" stroke-dasharray="4 4"/><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">累加平方距离：E(p)=pᵀQp</text></svg>