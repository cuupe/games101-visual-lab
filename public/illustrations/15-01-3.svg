<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>距离加倍：密度变四分之一</title><desc>面仍倾斜 60°，从 2 m 移到 4 m，距离因素与朝向因素相乘。</desc><rect width="360" height="264" fill="#0b1421"/><text x="180" y="25" fill="#9bb0ca" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">保持夹角 60°</text><circle cx="42" cy="81" r="10" fill="#f3b47f" stroke="none" stroke-width="2"/><line x1="56" y1="81" x2="62" y2="81" stroke="#f3b47f" stroke-width="2"/><line x1="51.9" y1="90.9" x2="56.14" y2="95.14" stroke="#f3b47f" stroke-width="2"/><line x1="42" y1="95" x2="42" y2="101" stroke="#f3b47f" stroke-width="2"/><line x1="32.1" y1="90.9" x2="27.86" y2="95.14" stroke="#f3b47f" stroke-width="2"/><line x1="28" y1="81" x2="22" y2="81" stroke="#f3b47f" stroke-width="2"/><line x1="32.1" y1="71.1" x2="27.86" y2="66.86" stroke="#f3b47f" stroke-width="2"/><line x1="42" y1="67" x2="42" y2="61" stroke="#f3b47f" stroke-width="2"/><line x1="51.9" y1="71.1" x2="56.14" y2="66.86" stroke="#f3b47f" stroke-width="2"/><polygon points="113,40 153,83 124,153 86,111" fill="#142235" stroke="#83baff" stroke-width="2" stroke-linejoin="round"/><polygon points="259,68 308,119 269,205 220,153" fill="#142235" stroke="#b9a2ff" stroke-width="2" stroke-linejoin="round"/><line x1="45" y1="86" x2="271" y2="137" stroke="#f3b47f" stroke-width="2" stroke-dasharray="5 4"/><text x="93" y="186" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">r=2</text><text x="251" y="49" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">r=4</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">E：1.00 → 0.25 W/m²</text></svg>