<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>重心：三块面积相等</title><desc>P 是三个顶点的平均位置，红、绿、蓝子三角形面积相同。</desc><rect width="360" height="264" fill="#0b1421"/><polygon points="65,205 300,205 140,48" fill="#142235" stroke="#9bb0ca" stroke-width="2" stroke-linejoin="round"/><polygon points="168.33,152.67 300,205 140,48" fill="#ff8c9f66" stroke="#ff8c9f" stroke-width="2" stroke-linejoin="round"/><polygon points="168.33,152.67 140,48 65,205" fill="#82dfbd66" stroke="#82dfbd" stroke-width="2" stroke-linejoin="round"/><polygon points="168.33,152.67 65,205 300,205" fill="#83baff66" stroke="#83baff" stroke-width="2" stroke-linejoin="round"/><circle cx="168.33" cy="152.67" r="5" fill="#e0eaf7" stroke="none" stroke-width="2"/><text x="45" y="219" fill="#ff8c9f" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">A</text><text x="306" y="219" fill="#82dfbd" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">B</text><text x="135" y="35" fill="#83baff" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">C</text><text x="176.33" y="146.67" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">P</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">α = β = γ = 1/3</text></svg>