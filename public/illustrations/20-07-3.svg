<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>同一灰块，不同背景</title><desc>中央两个方块均为编码 #808080；周围背景分别是深灰与浅灰。请比较感受再核对值。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="20" y="48" width="155" height="160" rx="0" fill="#222222" stroke="none"/><rect x="185" y="48" width="155" height="160" rx="0" fill="#dddddd" stroke="none"/><rect x="65" y="95" width="65" height="65" rx="0" fill="#808080" stroke="none"/><rect x="230" y="95" width="65" height="65" rx="0" fill="#808080" stroke="none"/><text x="20" y="25" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">中心块数值完全相同</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">上下文影响明暗判断</text></svg>