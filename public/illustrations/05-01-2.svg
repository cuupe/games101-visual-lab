<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>映射到视口</title><desc>视口变换把标准坐标范围映射到有限屏幕范围。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="34" y="35" width="290" height="175" rx="0" fill="#142235" stroke="#83baff"/><polygon points="78,180 292,169 177,55" fill="#163d3f" stroke="#82dfbd" stroke-width="2" stroke-linejoin="round"/><text x="180" y="248" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">标准范围 → 屏幕宽高</text></svg>