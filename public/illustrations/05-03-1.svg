<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>非共线三点</title><desc>三点确定平面，叉积可给出朝向。</desc><rect width="360" height="264" fill="#0b1421"/><polygon points="125,156 235,156 144.25,120.25" fill="#183b3d" stroke="#82dfbd" stroke-width="2" stroke-linejoin="round"/><line x1="167.49" y1="143.49" x2="201.45" y2="72.95" stroke="#f3b47f" stroke-width="2.7"/><polygon points="201.45,72.95 201.55,81.95 194.35,78.48" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="180" y="34" fill="#e0eaf7" font-size="20" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">三点定义一个平面</text><text x="180" y="248" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">非共线时：法线与绕序可确定</text></svg>