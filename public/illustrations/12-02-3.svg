<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>旧点：按度数重新加权</title><desc>橙色旧点的度数 n=3，邻居为上、左下、右下三个蓝点；采用 β=3/16 同步更新。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="180" y1="110" x2="75" y2="190" stroke="#2a3d55" stroke-width="2"/><circle cx="75" cy="190" r="6" fill="#83baff" stroke="none" stroke-width="2"/><line x1="180" y1="110" x2="285" y2="190" stroke="#2a3d55" stroke-width="2"/><circle cx="285" cy="190" r="6" fill="#83baff" stroke="none" stroke-width="2"/><line x1="180" y1="110" x2="180" y2="35" stroke="#2a3d55" stroke-width="2"/><circle cx="180" cy="35" r="6" fill="#83baff" stroke="none" stroke-width="2"/><circle cx="180" cy="110" r="7" fill="#f3b47f" stroke="none" stroke-width="2"/><circle cx="180" cy="125.94" r="7" fill="#82dfbd" stroke="none" stroke-width="2"/><line x1="198" y1="110" x2="198" y2="125.94" stroke="#82dfbd" stroke-width="2.7"/><polygon points="198,125.94 194,117.87 202,117.87" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="214" y="109" fill="#f3b47f" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">旧 P</text><text x="214" y="149" fill="#82dfbd" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">新 P′</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">P′ = 7/16 P + 3/16 Σ邻居</text></svg>