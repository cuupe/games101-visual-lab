<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>未归一化：点积不等于余弦</title><desc>蓝色法线长度 2，橙色光方向长度 1；二者同向，但点积为 2。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="110" y1="208" x2="110" y2="55" stroke="#83baff" stroke-width="4"/><polygon points="110,55 114,63.06 106,63.06" fill="#83baff" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="220" y1="208" x2="220" y2="132" stroke="#f3b47f" stroke-width="4"/><polygon points="220,132 224,140.06 216,140.06" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="67" y="40" fill="#83baff" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">|n| = 2</text><text x="202" y="119" fill="#f3b47f" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">|l| = 1</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">错误：n·l = 2 &gt; 1</text></svg>