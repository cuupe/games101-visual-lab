<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>交换输入</title><desc>a×b 与 b×a 互为相反向量，面积绝对值不变。</desc><rect width="360" height="264" fill="#0b1421"/><polygon points="180,156 290,156 290,73.5 180,73.5" fill="#183c3c" stroke="#2a3d55" stroke-width="2" stroke-linejoin="round"/><line x1="180" y1="156" x2="290" y2="156" stroke="#82dfbd" stroke-width="2.7"/><polygon points="290,156 281.94,160 281.94,152" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="180" y1="156" x2="180" y2="73.5" stroke="#b9a2ff" stroke-width="2.7"/><polygon points="180,73.5 184,81.56 176,81.56" fill="#b9a2ff" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="180" y1="156" x2="254.1" y2="116.1" stroke="#f3b47f" stroke-width="2.7"/><polygon points="254.1,116.1 248.89,123.44 245.11,116.41" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="37" y="212" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">n 朝向 −z</text><text x="45" y="35" fill="#e0eaf7" font-size="20" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">交换 a、b 的次序</text><text x="180" y="248" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">平行四边形面积 = 3</text></svg>