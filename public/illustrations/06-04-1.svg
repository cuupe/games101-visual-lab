<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>采样率太低</title><desc>原频谱半宽 B=3 Hz，副本间隔 fs=5 Hz；邻近支撑区互相重叠。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="20" y1="196" x2="337" y2="196" stroke="#9bb0ca" stroke-width="1.5"/><polygon points="337,196 328.94,200 328.94,192" fill="#9bb0ca" stroke="none" stroke-width="2" stroke-linejoin="round"/><polygon points="68,196 110,70 152,196" fill="#b9a2ff66" stroke="#b9a2ff" stroke-width="2" stroke-linejoin="round"/><text x="110" y="219" fill="#b9a2ff" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">-5</text><polygon points="138,196 180,70 222,196" fill="#82dfbd66" stroke="#82dfbd" stroke-width="2" stroke-linejoin="round"/><text x="180" y="219" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">0</text><polygon points="208,196 250,70 292,196" fill="#b9a2ff66" stroke="#b9a2ff" stroke-width="2" stroke-linejoin="round"/><text x="250" y="219" fill="#b9a2ff" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">5</text><text x="25" y="40" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">频谱支撑：−B 到 +B</text><text x="324" y="42" fill="#9bb0ca" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">f</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">fs = 5 &lt; 2B = 6，出现混叠</text></svg>