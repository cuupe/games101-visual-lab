<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>微面之间会遮挡光与视线</title><desc>橙色入射光被高微面挡住，凹部微面不能无条件贡献镜面反射。</desc><rect width="360" height="264" fill="#0b1421"/><polyline points="29,177 89,119 120,185 194,98 235,183 302,120 332,166" fill="none" stroke="#b9a2ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="31" y1="54" x2="163" y2="134" stroke="#f3b47f" stroke-width="2.7"/><polygon points="163,134 154.03,133.24 158.17,126.4" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="163" y1="134" x2="226" y2="172" stroke="#ff8c9f" stroke-width="2" stroke-dasharray="5 4"/><circle cx="163" cy="134" r="5" fill="#ff8c9f" stroke="none" stroke-width="2"/><line x1="232" y1="177" x2="302" y2="47" stroke="#82dfbd" stroke-width="2.7"/><polygon points="302,47 301.69,55.99 294.66,52.21" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="28" y="218" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">遮挡与掩蔽由 G 描述</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">D × F × G；不能仅改变高光亮度</text></svg>