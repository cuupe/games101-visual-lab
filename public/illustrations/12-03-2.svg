<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>内部边点：四项平均</title><desc>共享边端点 A、B 和左右面点 F₁、F₂ 各占 1/4；面点由各自原面先计算得到。</desc><rect width="360" height="264" fill="#0b1421"/><polygon points="65,50 180,65 180,190 65,165" fill="#83baff22" stroke="#83baff" stroke-width="2" stroke-linejoin="round"/><polygon points="180,65 290,105 290,210 180,190" fill="#b9a2ff22" stroke="#b9a2ff" stroke-width="2" stroke-linejoin="round"/><circle cx="180" cy="65" r="4" fill="#f3b47f" stroke="none" stroke-width="2"/><text x="188" y="56" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">A</text><circle cx="180" cy="190" r="4" fill="#f3b47f" stroke="none" stroke-width="2"/><text x="188" y="181" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">B</text><circle cx="122.5" cy="117.5" r="4" fill="#83baff" stroke="none" stroke-width="2"/><text x="130.5" y="108.5" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">F₁</text><circle cx="235" cy="142.5" r="4" fill="#b9a2ff" stroke="none" stroke-width="2"/><text x="243" y="133.5" fill="#b9a2ff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">F₂</text><circle cx="179.38" cy="128.75" r="7" fill="#82dfbd" stroke="none" stroke-width="2"/><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">E = (A+B+F₁+F₂)/4</text></svg>