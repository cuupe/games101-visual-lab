<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>区间不重叠就整盒无交</title><desc>无限直线能分别穿过两个 slab，却不能同时位于两者内部。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="55" y1="91" x2="315" y2="91" stroke="#2a3d55" stroke-width="2"/><line x1="92" y1="91" x2="129" y2="91" stroke="#83baff" stroke-width="8"/><text x="18" y="96" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">x</text><text x="88" y="78" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">1</text><text x="125" y="78" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">2</text><line x1="55" y1="151" x2="315" y2="151" stroke="#2a3d55" stroke-width="2"/><line x1="166" y1="151" x2="240" y2="151" stroke="#b9a2ff" stroke-width="8"/><text x="18" y="156" fill="#b9a2ff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">y</text><text x="162" y="138" fill="#b9a2ff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">3</text><text x="236" y="138" fill="#b9a2ff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">5</text><line x1="129" y1="56" x2="129" y2="192" stroke="#83baff" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="166" y1="56" x2="166" y2="192" stroke="#b9a2ff" stroke-width="1.5" stroke-dasharray="5 4"/><text x="101" y="213" fill="#ff8c9f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">进入 3 &gt; 离开 2</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">区间交集为空：拒绝</text></svg>