<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>先平均线性光再编码</title><desc>线性光平均为 0.5，再用 sRGB 分段函数编码为约 0.735；灰块按此编码显示。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="65" y="58" width="230" height="146" rx="0" fill="#bcbcbc" stroke="none"/><text x="20" y="25" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">正确计算域：平均光能</text><text x="180" y="225" fill="#e0eaf7" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">屏幕编码 0.735</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">线性 0.5 → 编码 0.735</text></svg>