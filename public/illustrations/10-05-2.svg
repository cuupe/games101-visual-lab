<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>交集：同时属于 A 与 B</title><desc>只有两个圆重叠的透镜区域着色；max(fA,fB)&lt;0 要求两个函数都为负。</desc><rect width="360" height="264" fill="#0b1421"/><defs><clipPath id="intersectionB"><circle cx="225" cy="125" r="64"/></clipPath></defs><circle cx="135" cy="125" r="64" fill="none" stroke="#83baff" stroke-width="2"/><circle cx="225" cy="125" r="64" fill="none" stroke="#b9a2ff" stroke-width="2"/><g clip-path="url(#intersectionB)"><circle cx="135" cy="125" r="64" fill="#82dfbdbb" stroke="none" stroke-width="2"/></g><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">A∩B：max(fA,fB)</text></svg>