<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>越界：Repeat 与 Clamp</title><desc>查询 u=1.2 时，Repeat 环绕到 0.2；Clamp 则钳制到最右边界 1。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="38" y="67" width="284" height="45" rx="0" fill="#142235" stroke="#9bb0ca"/><line x1="40" y1="123" x2="322" y2="123" stroke="#9bb0ca" stroke-width="1.5"/><polygon points="322,123 313.94,127 313.94,119" fill="#9bb0ca" stroke="none" stroke-width="2" stroke-linejoin="round"/><circle cx="97" cy="89" r="6" fill="#82dfbd" stroke="none" stroke-width="2"/><circle cx="320" cy="89" r="6" fill="#f3b47f" stroke="none" stroke-width="2"/><text x="59" y="49" fill="#82dfbd" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">Repeat</text><text x="243" y="49" fill="#f3b47f" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">Clamp</text><text x="98" y="157" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">u = 0.2</text><text x="278" y="157" fill="#f3b47f" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">u = 1</text><text x="180" y="199" fill="#e0eaf7" font-size="18" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">输入坐标：u = 1.2</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">边界行为必须明确设置</text></svg>