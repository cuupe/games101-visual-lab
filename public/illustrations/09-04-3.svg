<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>不同相位：稳定的区域值</title><desc>对覆盖完整周期的足迹求平均，移动相位仍为 0.5；正确低通能抑制缩小时的闪烁。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="37" y="66" width="80" height="116" rx="0" fill="#808080" stroke="#9bb0ca"/><text x="77" y="209" fill="#9bb0ca" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">相位 -1</text><rect x="141" y="66" width="80" height="116" rx="0" fill="#808080" stroke="#9bb0ca"/><text x="181" y="209" fill="#9bb0ca" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">相位 0</text><rect x="245" y="66" width="80" height="116" rx="0" fill="#808080" stroke="#9bb0ca"/><text x="285" y="209" fill="#9bb0ca" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">相位 1</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">预过滤对应像素的完整足迹</text></svg>