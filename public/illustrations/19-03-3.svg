<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>收光圈，提高 ISO</title><desc>快门仍为 1/100 s，光子数约为基准 0.49；ISO 200 仅把此图增益加倍。</desc><rect width="360" height="264" fill="#0b1421"/><text x="25" y="25" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">f/4 · 1/100 s · ISO 200</text><text x="25" y="63" fill="#9bb0ca" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">光子收集</text><rect x="125" y="44" width="73.5" height="26" rx="0" fill="#82dfbd" stroke="none"/><text x="25" y="110" fill="#9bb0ca" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">输出增益</text><rect x="125" y="91" width="150" height="26" rx="0" fill="#b9a2ff" stroke="none"/><text x="25" y="151" fill="#9bb0ca" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">物体投影速度 100 px/s</text><line x1="55" y1="184" x2="125" y2="184" stroke="#f3b47f" stroke-width="15"/><circle cx="55" cy="184" r="6" fill="#e0eaf7" stroke="none" stroke-width="2"/><text x="55" y="218" fill="#f3b47f" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">轨迹长度 1 px</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">增益补亮，不补收集光子</text></svg>