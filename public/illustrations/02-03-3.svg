<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>共线退化</title><desc>共线时面积和叉积都为零，不能直接生成单位法线。</desc><rect width="360" height="264" fill="#0b1421"/><polygon points="180,156 290,156 345,156 235,156" fill="#183c3c" stroke="#2a3d55" stroke-width="2" stroke-linejoin="round"/><line x1="180" y1="156" x2="290" y2="156" stroke="#82dfbd" stroke-width="2.7"/><polygon points="290,156 281.94,160 281.94,152" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="180" y1="156" x2="235" y2="156" stroke="#b9a2ff" stroke-width="2.7"/><polygon points="235,156 226.94,160 226.94,152" fill="#b9a2ff" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="45" y="35" fill="#e0eaf7" font-size="20" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">两条边共线</text><text x="180" y="248" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">叉积为零 · 面积为零</text></svg>