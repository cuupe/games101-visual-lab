<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>进入玻璃：折向法线</title><desc>空气到玻璃，入射角 40° 对应折射角约 25.4°，两角都相对法线。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="30" y="124" width="301" height="92" rx="0" fill="#183247" stroke="none"/><line x1="30" y1="124" x2="331" y2="124" stroke="#83baff" stroke-width="3"/><line x1="177" y1="38" x2="177" y2="211" stroke="#9bb0ca" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="111" y1="46" x2="177" y2="124" stroke="#f3b47f" stroke-width="2.7"/><polygon points="177,124 168.74,120.42 174.84,115.26" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="177" y1="124" x2="218" y2="210" stroke="#82dfbd" stroke-width="2.7"/><polygon points="218,210 210.92,204.44 218.14,201" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="212" y="61" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">空气 n=1</text><text x="30" y="165" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">玻璃 n=1.5</text><text x="69" y="98" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">40°</text><text x="224" y="198" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">25.4°</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">n₁ sinθᵢ = n₂ sinθₜ</text></svg>