<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>KD-tree：用平面划空间</title><desc>橙色物体跨越分割平面，可能在左右两叶中各保存一个引用。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="33" y="49" width="291" height="155" rx="0" fill="#142235" stroke="#83baff"/><rect x="33" y="49" width="145" height="155" rx="0" fill="#183646" stroke="none"/><rect x="178" y="49" width="146" height="155" rx="0" fill="#332a48" stroke="none"/><line x1="178" y1="49" x2="178" y2="204" stroke="#82dfbd" stroke-width="4"/><polygon points="80,180 277,91 235,188" fill="none" stroke="#f3b47f" stroke-width="2" stroke-linejoin="round"/><text x="62" y="82" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">左空间</text><text x="224" y="82" fill="#b9a2ff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">右空间</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">子空间分离，引用可以重复</text></svg>