<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>针孔：倒立映射</title><desc>两条中心射线穿过小孔；物点越高，像点越低。图中仅展示几何针孔。</desc><rect width="360" height="264" fill="#0b1421"/><text x="25" y="25" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">一个孔限制方向</text><line x1="290" y1="48" x2="290" y2="215" stroke="#83baff" stroke-width="4"/><text x="246" y="42" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">感光面</text><circle cx="42" cy="70" r="6" fill="#f3b47f" stroke="none" stroke-width="2"/><line x1="42" y1="70" x2="180" y2="130" stroke="#f3b47f" stroke-width="2"/><line x1="180" y1="130" x2="290" y2="177.83" stroke="#f3b47f" stroke-width="2"/><circle cx="290" cy="177.83" r="4" fill="#f3b47f" stroke="none" stroke-width="2"/><circle cx="42" cy="175" r="6" fill="#b9a2ff" stroke="none" stroke-width="2"/><line x1="42" y1="175" x2="180" y2="130" stroke="#b9a2ff" stroke-width="2"/><line x1="180" y1="130" x2="290" y2="94.13" stroke="#b9a2ff" stroke-width="2"/><circle cx="290" cy="94.13" r="4" fill="#b9a2ff" stroke="none" stroke-width="2"/><line x1="180" y1="48" x2="180" y2="124" stroke="#9bb0ca" stroke-width="6"/><line x1="180" y1="136" x2="180" y2="215" stroke="#9bb0ca" stroke-width="6"/><text x="158" y="42" fill="#9bb0ca" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">针孔</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">限制方向，牺牲进光量</text></svg>