<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>薄透镜：多线会聚</title><desc>来自同一物点的三条光线在正确像面汇合；中心射线保持直线，其他射线由透镜折向同一像点。</desc><rect width="360" height="264" fill="#0b1421"/><text x="25" y="25" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">同一点的光线会聚</text><line x1="290" y1="48" x2="290" y2="215" stroke="#83baff" stroke-width="4"/><text x="246" y="42" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">感光面</text><circle cx="42" cy="70" r="6" fill="#f3b47f" stroke="none" stroke-width="2"/><line x1="42" y1="70" x2="180" y2="80" stroke="#f3b47f" stroke-width="1.7"/><line x1="180" y1="80" x2="290" y2="177.83" stroke="#f3b47f" stroke-width="1.7"/><line x1="42" y1="70" x2="180" y2="130" stroke="#f3b47f" stroke-width="1.7"/><line x1="180" y1="130" x2="290" y2="177.83" stroke="#f3b47f" stroke-width="1.7"/><line x1="42" y1="70" x2="180" y2="180" stroke="#f3b47f" stroke-width="1.7"/><line x1="180" y1="180" x2="290" y2="177.83" stroke="#f3b47f" stroke-width="1.7"/><circle cx="290" cy="177.83" r="4" fill="#f3b47f" stroke="none" stroke-width="2"/><circle cx="42" cy="175" r="6" fill="#b9a2ff" stroke="none" stroke-width="2"/><line x1="42" y1="175" x2="180" y2="80" stroke="#b9a2ff" stroke-width="1.7"/><line x1="180" y1="80" x2="290" y2="94.13" stroke="#b9a2ff" stroke-width="1.7"/><line x1="42" y1="175" x2="180" y2="130" stroke="#b9a2ff" stroke-width="1.7"/><line x1="180" y1="130" x2="290" y2="94.13" stroke="#b9a2ff" stroke-width="1.7"/><line x1="42" y1="175" x2="180" y2="180" stroke="#b9a2ff" stroke-width="1.7"/><line x1="180" y1="180" x2="290" y2="94.13" stroke="#b9a2ff" stroke-width="1.7"/><circle cx="290" cy="94.13" r="4" fill="#b9a2ff" stroke="none" stroke-width="2"/><path d="M180 55 Q159 130 180 205 Q201 130 180 55" fill="none" stroke="#82dfbd" stroke-width="3"/><text x="152" y="43" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">透镜</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">方向对应与收光量是两件事</text></svg>