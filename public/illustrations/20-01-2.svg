<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>双平面标定一条射线</title><desc>四维表示使用两个平面上的两对交点坐标；这里仅画 u–s 二维截面。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="85" y1="48" x2="85" y2="205" stroke="#83baff" stroke-width="3"/><line x1="275" y1="48" x2="275" y2="205" stroke="#b9a2ff" stroke-width="3"/><line x1="40" y1="190" x2="320" y2="60" stroke="#82dfbd" stroke-width="3"/><circle cx="85" cy="169.11" r="5" fill="#f3b47f" stroke="none" stroke-width="2"/><circle cx="275" cy="80.89" r="5" fill="#f3b47f" stroke="none" stroke-width="2"/><text x="60" y="35" fill="#83baff" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">(u,v)</text><text x="249" y="35" fill="#b9a2ff" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">(s,t)</text><text x="20" y="225" fill="#9bb0ca" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">沿射线移动：辐亮度不变</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">无吸收散射区域才能降维</text></svg>