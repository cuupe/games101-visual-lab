<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>合法重心坐标</title><desc>A=(0,0)、B=(1,0)、C=(0,1)，点由三个非负权重组合。</desc><rect width="360" height="264" fill="#0b1421"/><polygon points="62,192 310,192 62,50" fill="#142235" stroke="#83baff" stroke-width="2" stroke-linejoin="round"/><circle cx="62" cy="192" r="4" fill="#83baff" stroke="none" stroke-width="2"/><text x="69" y="184" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">A</text><circle cx="310" cy="192" r="4" fill="#83baff" stroke="none" stroke-width="2"/><text x="317" y="184" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">B</text><circle cx="62" cy="50" r="4" fill="#83baff" stroke="none" stroke-width="2"/><text x="69" y="42" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">C</text><circle cx="112" cy="149" r="4" fill="#82dfbd" stroke="none" stroke-width="2"/><text x="119" y="141" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">u=.2，v=.3</text><text x="166" y="99" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">A 权重=.5</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">u≥0，v≥0，u+v=.5≤1</text></svg>