<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>等质量距离约束投影</title><desc>预测端点相距 1.2 m，静止约束 1 m；两端各向内移 0.1 m，随后要由修正位移更新速度。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="54" y1="85" x2="294" y2="85" stroke="#9bb0ca" stroke-width="3"/><circle cx="54" cy="85" r="8" fill="#83baff" stroke="none" stroke-width="2"/><circle cx="294" cy="85" r="8" fill="#f3b47f" stroke="none" stroke-width="2"/><text x="126" y="55" fill="#9bb0ca" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">预测 1.2 m</text><line x1="54" y1="110" x2="74" y2="151" stroke="#83baff" stroke-width="2.7"/><polygon points="74,151 66.87,145.5 74.06,142" fill="#83baff" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="294" y1="110" x2="274" y2="151" stroke="#f3b47f" stroke-width="2.7"/><polygon points="274,151 273.94,142 281.13,145.5" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="74" y1="169" x2="274" y2="169" stroke="#82dfbd" stroke-width="3"/><circle cx="74" cy="169" r="8" fill="#83baff" stroke="none" stroke-width="2"/><circle cx="274" cy="169" r="8" fill="#f3b47f" stroke="none" stroke-width="2"/><text x="131" y="205" fill="#82dfbd" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">投影 1.0 m</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">位置满足约束不等于能量守恒</text></svg>