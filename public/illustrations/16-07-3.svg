<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>相机改变后必须清空累计</title><desc>旧视图和新视图来自不同积分问题，混在一个平均中会形成重影。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="28" y="57" width="133" height="142" rx="5" fill="#142235" stroke="#83baff"/><rect x="199" y="57" width="133" height="142" rx="5" fill="#142235" stroke="#82dfbd"/><circle cx="64" cy="124" r="24" fill="#83baff" stroke="none" stroke-width="2"/><circle cx="127" cy="124" r="24" fill="none" stroke="#ff8c9f" stroke-width="2"/><circle cx="263" cy="124" r="25" fill="#82dfbd" stroke="none" stroke-width="2"/><text x="30" y="225" fill="#ff8c9f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">旧样本混合</text><text x="212" y="225" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">清零后累积</text><line x1="168" y1="125" x2="192" y2="125" stroke="#f3b47f" stroke-width="2.7"/><polygon points="192,125 183.94,129 183.94,121" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">改相机/场景 → 重置 n 与缓冲</text></svg>