<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>同一条路径能被两种技术生成</title><desc>显式灯采样与 BRDF 方向采样，都可能生成同一条表面到灯的连接。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="28" y1="199" x2="332" y2="199" stroke="#83baff" stroke-width="4"/><circle cx="284" cy="67" r="10" fill="#f3b47f" stroke="none" stroke-width="2"/><line x1="298" y1="67" x2="304" y2="67" stroke="#f3b47f" stroke-width="2"/><line x1="293.9" y1="76.9" x2="298.14" y2="81.14" stroke="#f3b47f" stroke-width="2"/><line x1="284" y1="81" x2="284" y2="87" stroke="#f3b47f" stroke-width="2"/><line x1="274.1" y1="76.9" x2="269.86" y2="81.14" stroke="#f3b47f" stroke-width="2"/><line x1="270" y1="67" x2="264" y2="67" stroke="#f3b47f" stroke-width="2"/><line x1="274.1" y1="57.1" x2="269.86" y2="52.86" stroke="#f3b47f" stroke-width="2"/><line x1="284" y1="53" x2="284" y2="47" stroke="#f3b47f" stroke-width="2"/><line x1="293.9" y1="57.1" x2="298.14" y2="52.86" stroke="#f3b47f" stroke-width="2"/><line x1="163" y1="199" x2="284" y2="80" stroke="#82dfbd" stroke-width="4"/><polygon points="284,80 281.05,88.5 275.45,82.81" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="170" y1="199" x2="291" y2="80" stroke="#b9a2ff" stroke-width="2" stroke-dasharray="5 4"/><text x="24" y="80" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">技术 A：灯采样</text><text x="24" y="111" fill="#b9a2ff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">技术 B：BRDF</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">把两项都完整累加可能重复计数</text></svg>