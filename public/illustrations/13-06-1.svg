<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>舍入误差造成自交</title><desc>实际交点应在面上；向内舍入后的起点会马上再次击中当前表面。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="28" y1="168" x2="332" y2="168" stroke="#83baff" stroke-width="4"/><circle cx="169" cy="172" r="5" fill="#ff8c9f" stroke="none" stroke-width="2"/><line x1="169" y1="172" x2="275" y2="67" stroke="#ff8c9f" stroke-width="2.7"/><polygon points="275,67 272.08,75.51 266.46,69.84" fill="#ff8c9f" stroke="none" stroke-width="2" stroke-linejoin="round"/><circle cx="173" cy="168" r="5" fill="#f3b47f" stroke="none" stroke-width="2"/><text x="32" y="67" fill="#9bb0ca" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">误差被放大展示</text><text x="42" y="130" fill="#ff8c9f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">起点略在面内</text><text x="215" y="154" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">自身命中</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">偏移方向与 tmin 要共同确定</text></svg>