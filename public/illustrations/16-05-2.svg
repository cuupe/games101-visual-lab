<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>直接在灯面上选点</title><desc>连接采样点并检查遮挡，每个样本都朝向灯，但并非都可见。</desc><rect width="360" height="264" fill="#0b1421"/><line x1="28" y1="202" x2="332" y2="202" stroke="#83baff" stroke-width="4"/><rect x="236" y="45" width="92" height="9" rx="0" fill="#f3b47f" stroke="none"/><line x1="176" y1="202" x2="241" y2="54" stroke="#82dfbd" stroke-width="2"/><polygon points="241,54 241.42,62.99 234.1,59.78" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="176" y1="202" x2="260" y2="54" stroke="#82dfbd" stroke-width="2"/><polygon points="260,54 259.49,62.99 252.54,59.04" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="176" y1="202" x2="280" y2="54" stroke="#82dfbd" stroke-width="2"/><polygon points="280,54 278.63,62.9 272.09,58.3" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="176" y1="202" x2="300" y2="54" stroke="#82dfbd" stroke-width="2"/><polygon points="300,54 297.88,62.75 291.76,57.62" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="176" y1="202" x2="321" y2="54" stroke="#82dfbd" stroke-width="2"/><polygon points="321,54 318.21,62.56 312.5,56.96" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><rect x="204" y="120" width="42" height="17" rx="0" fill="#ff8c9f" stroke="none"/><text x="21" y="87" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">选灯面位置</text><text x="32" y="135" fill="#ff8c9f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">仍检查遮挡</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">灯面 PDF 的单位为 m⁻²</text></svg>