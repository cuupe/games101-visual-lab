<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>对齐近景</title><desc>每行按绿点对应的深度平移；绿点重合，橙点在求和后会展开。</desc><rect width="360" height="264" fill="#0b1421"/><text x="20" y="25" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">按目标深度平移子视图</text><text x="15" y="77" fill="#9bb0ca" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">u=-1</text><rect x="68" y="48" width="258" height="35" rx="0" fill="#142235" stroke="none"/><circle cx="170" cy="65" r="8" fill="#82dfbd" stroke="none" stroke-width="2"/><circle cx="271" cy="65" r="8" fill="#f3b47f" stroke="none" stroke-width="2"/><text x="15" y="134" fill="#9bb0ca" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">u=0</text><rect x="68" y="105" width="258" height="35" rx="0" fill="#142235" stroke="none"/><circle cx="170" cy="122" r="8" fill="#82dfbd" stroke="none" stroke-width="2"/><circle cx="256" cy="122" r="8" fill="#f3b47f" stroke="none" stroke-width="2"/><text x="15" y="191" fill="#9bb0ca" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">u=1</text><rect x="68" y="162" width="258" height="35" rx="0" fill="#142235" stroke="none"/><circle cx="170" cy="179" r="8" fill="#82dfbd" stroke="none" stroke-width="2"/><circle cx="241" cy="179" r="8" fill="#f3b47f" stroke="none" stroke-width="2"/><text x="72" y="227" fill="#9bb0ca" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">绿：近点     橙：远点</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">近景对齐，远景仍错位</text></svg>