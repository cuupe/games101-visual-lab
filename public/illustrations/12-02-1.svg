<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>连线：每片三角形变四片</title><desc>橙点只示意新边点的拓扑位置；准确位置仍需两端与对面顶点共同加权。</desc><rect width="360" height="264" fill="#0b1421"/><polygon points="57,203 309,203 160,43" fill="#142235" stroke="#82dfbd" stroke-width="2" stroke-linejoin="round"/><polygon points="183,203 234.5,123 108.5,123" fill="#b9a2ff44" stroke="#82dfbd" stroke-width="2" stroke-linejoin="round"/><circle cx="183" cy="203" r="6" fill="#f3b47f" stroke="none" stroke-width="2"/><circle cx="234.5" cy="123" r="6" fill="#f3b47f" stroke="none" stroke-width="2"/><circle cx="108.5" cy="123" r="6" fill="#f3b47f" stroke="none" stroke-width="2"/><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">插点与连线规则，并非位置规则</text></svg>