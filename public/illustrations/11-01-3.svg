<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>OBJ：位置、UV、法线可独立索引</title><desc>示例 f 的三个条目分别引用位置/UV/法线；共享位置在接缝处可以引用不同 UV。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="29" y="45" width="302" height="173" rx="0" fill="#142235" stroke="#2a3d55"/><text x="45" y="77" fill="#83baff" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">v  0 0 0</text><text x="45" y="114" fill="#b9a2ff" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">vt 0.25 0.75</text><text x="45" y="151" fill="#82dfbd" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">vn 0 0 1</text><text x="45" y="188" fill="#f3b47f" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">f  1/1/1 2/2/1 3/3/1</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">v、vt、vn 是不同的索引序列</text></svg>