<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>面点：所有顶点的平均</title><desc>五边形取顶点平均作为橙色面点；连接新边点后得到五个四边形。边点这里只示意连接拓扑。</desc><rect width="360" height="264" fill="#0b1421"/><polygon points="180,36 296,104 256,206 104,206 64,104" fill="#142235" stroke="#9bb0ca" stroke-width="2" stroke-linejoin="round"/><polygon points="180,36 238,70 180,131.2 122,70" fill="#b9a2ff22" stroke="#82dfbd" stroke-width="1.5" stroke-linejoin="round"/><polygon points="296,104 276,155 180,131.2 238,70" fill="#82dfbd22" stroke="#82dfbd" stroke-width="1.5" stroke-linejoin="round"/><polygon points="256,206 180,206 180,131.2 276,155" fill="#b9a2ff22" stroke="#82dfbd" stroke-width="1.5" stroke-linejoin="round"/><polygon points="104,206 84,155 180,131.2 180,206" fill="#82dfbd22" stroke="#82dfbd" stroke-width="1.5" stroke-linejoin="round"/><polygon points="64,104 122,70 180,131.2 84,155" fill="#b9a2ff22" stroke="#82dfbd" stroke-width="1.5" stroke-linejoin="round"/><circle cx="180" cy="131.2" r="7" fill="#f3b47f" stroke="none" stroke-width="2"/><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">n 边形细分为 n 个四边形</text></svg>