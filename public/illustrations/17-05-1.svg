<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>绕法线共同旋转方向对</title><desc>俯视两对方向，夹角相同；各向同性材质的响应与共同旋转无关。</desc><rect width="360" height="264" fill="#0b1421"/><circle cx="91" cy="134" r="61" fill="#142235" stroke="#2a3d55" stroke-width="2"/><circle cx="268" cy="134" r="61" fill="#142235" stroke="#2a3d55" stroke-width="2"/><line x1="91" y1="134" x2="47" y2="92" stroke="#83baff" stroke-width="2.7"/><polygon points="47,92 55.59,94.68 50.07,100.46" fill="#83baff" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="91" y1="134" x2="143" y2="99" stroke="#f3b47f" stroke-width="2.7"/><polygon points="143,99 138.54,106.82 134.08,100.19" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="268" y1="134" x2="309" y2="90" stroke="#83baff" stroke-width="2.7"/><polygon points="309,90 306.43,98.62 300.58,93.18" fill="#83baff" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="268" y1="134" x2="301" y2="186" stroke="#f3b47f" stroke-width="2.7"/><polygon points="301,186 293.31,181.33 300.05,177.05" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><circle cx="91" cy="134" r="4" fill="#82dfbd" stroke="none" stroke-width="2"/><circle cx="268" cy="134" r="4" fill="#82dfbd" stroke="none" stroke-width="2"/><text x="72" y="222" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">原方向对</text><text x="223" y="222" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">旋转 90°</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">保持相对几何，fᵣ 不变</text></svg>