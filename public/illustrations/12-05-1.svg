<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>第一遍：光源最近深度</title><desc>光源位于顶部，中心射线先遇到红色遮挡物；阴影图保存最近深度 0.4，而不是后方地面 0.8。</desc><rect width="360" height="264" fill="#0b1421"/><circle cx="180" cy="35" r="9" fill="#f3b47f" stroke="none" stroke-width="2"/><line x1="180" y1="47" x2="180" y2="98" stroke="#f3b47f" stroke-width="2.7"/><polygon points="180,98 176,89.94 184,89.94" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><rect x="139" y="99" width="82" height="24" rx="0" fill="#ff8c9f" stroke="none"/><line x1="48" y1="204" x2="317" y2="204" stroke="#9bb0ca" stroke-width="3"/><line x1="180" y1="125" x2="180" y2="203" stroke="#ff8c9f" stroke-width="2" stroke-dasharray="5 4"/><text x="235" y="114" fill="#ff8c9f" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">0.4</text><text x="225" y="201" fill="#9bb0ca" font-size="18" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">0.8</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">光源深度图只保留最近表面</text></svg>