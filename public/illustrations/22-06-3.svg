<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>力偶：平移合力为零</title><desc>左端向下 10 N，右端向上 10 N，两端距质心各 1 m；两个力矩同号。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="80" y="91" width="200" height="85" rx="0" fill="#142235" stroke="#83baff"/><circle cx="180" cy="134" r="6" fill="#f3b47f" stroke="none" stroke-width="2"/><line x1="80" y1="135" x2="80" y2="210" stroke="#82dfbd" stroke-width="4"/><polygon points="80,210 76,201.94 84,201.94" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="280" y1="133" x2="280" y2="58" stroke="#82dfbd" stroke-width="4"/><polygon points="280,58 284,66.06 276,66.06" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="20" y="25" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">两力大小相等、方向相反</text><text x="140" y="214" fill="#9bb0ca" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">F合=0</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">τ合=20 N·m，仍可转动</text></svg>