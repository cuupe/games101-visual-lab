<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>参数式：直接生成表面点</title><desc>以 p(θ)=(cosθ,sinθ) 生成同一个圆截面；橙点代表 θ=45°。</desc><rect width="360" height="264" fill="#0b1421"/><circle cx="180" cy="125" r="77" fill="none" stroke="#82dfbd" stroke-width="2"/><line x1="180" y1="125" x2="257" y2="125" stroke="#9bb0ca" stroke-width="1.5"/><polygon points="257,125 248.94,129 248.94,121" fill="#9bb0ca" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="180" y1="125" x2="234.45" y2="70.55" stroke="#f3b47f" stroke-width="2.7"/><polygon points="234.45,70.55 231.57,79.08 225.92,73.43" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><circle cx="234.45" cy="70.55" r="6" fill="#f3b47f" stroke="none" stroke-width="2"/><text x="251" y="68" fill="#f3b47f" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">45°</text><text x="43" y="218" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">p = (√2/2, √2/2)</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">容易问：参数 θ 对应哪个点？</text></svg>