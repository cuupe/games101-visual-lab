<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>退化划分需要兜底</title><desc>所有质心相同时，位置判定可能得到空子集；按数量分割可终止。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="125" y="39" width="110" height="40" rx="7" fill="#142235" stroke="#83baff"/><text x="140" y="64" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">包围全部</text><line x1="153" y1="79" x2="83" y2="119" stroke="#2a3d55" stroke-width="2"/><line x1="207" y1="79" x2="277" y2="119" stroke="#2a3d55" stroke-width="2"/><rect x="34" y="119" width="98" height="42" rx="6" fill="#142235" stroke="#82dfbd"/><rect x="228" y="119" width="98" height="42" rx="6" fill="#142235" stroke="#b9a2ff"/><text x="83" y="145" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">0 个对象</text><text x="277" y="145" fill="#b9a2ff" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">6 个对象</text><line x1="277" y1="166" x2="277" y2="212" stroke="#ff8c9f" stroke-width="2.7"/><polygon points="277,212 273,203.94 281,203.94" fill="#ff8c9f" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="208" y="216" fill="#ff8c9f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">规模不减 → 循环</text><text x="54" y="25" fill="#ff8c9f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">相同质心 → 空侧</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">检测退化，再按索引分为 3 + 3</text></svg>