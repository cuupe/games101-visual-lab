<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>正确：先插值 u/w 与 1/w</title><desc>屏幕中点的 u/w 为 1/6，1/w 为 2/3；相除得到 u=1/4。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="40" y="58" width="280" height="45" rx="0" fill="#142235" stroke="#83baff"/><text x="180" y="86" fill="#83baff" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">u/w：0.5×0 + 0.5×1/3</text><rect x="40" y="124" width="280" height="45" rx="0" fill="#142235" stroke="#b9a2ff"/><text x="180" y="152" fill="#b9a2ff" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">1/w：0.5×1 + 0.5×1/3</text><line x1="180" y1="175" x2="180" y2="196" stroke="#f3b47f" stroke-width="2.7"/><polygon points="180,196 176,187.94 184,187.94" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="180" y="218" fill="#82dfbd" font-size="19" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">(1/6)/(2/3) = 0.25</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">同一屏幕中点，正确 u = 0.25</text></svg>