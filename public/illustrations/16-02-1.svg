<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>单张结果仍会偏离真值</title><desc>八次独立实验的估计落在真值两侧；期望不是每次结果。</desc><rect width="360" height="264" fill="#0b1421"/><text x="180" y="25" fill="#9bb0ca" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">每个点是一组独立估计</text><line x1="180" y1="57" x2="180" y2="205" stroke="#82dfbd" stroke-width="2" stroke-dasharray="5 4"/><circle cx="113" cy="116" r="4" fill="#83baff" stroke="none" stroke-width="2"/><circle cx="143" cy="131" r="4" fill="#83baff" stroke="none" stroke-width="2"/><circle cx="164" cy="146" r="4" fill="#83baff" stroke="none" stroke-width="2"/><circle cx="208" cy="116" r="4" fill="#83baff" stroke="none" stroke-width="2"/><circle cx="226" cy="131" r="4" fill="#83baff" stroke="none" stroke-width="2"/><circle cx="183" cy="146" r="4" fill="#83baff" stroke="none" stroke-width="2"/><circle cx="196" cy="116" r="4" fill="#83baff" stroke="none" stroke-width="2"/><circle cx="207" cy="131" r="4" fill="#83baff" stroke="none" stroke-width="2"/><text x="191" y="81" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">真值</text><text x="34" y="217" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">有限样本仍有随机误差</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">无偏：重复实验的 E[Î]=I</text></svg>