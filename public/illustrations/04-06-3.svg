<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>NDC → 屏幕</title><desc>以左下为原点，NDC (0.5,−0.5) 在 640×480 视口变为 (480,120)。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="52" y="27" width="256" height="192" rx="0" fill="#142235" stroke="#83baff"/><line x1="52" y1="123" x2="308" y2="123" stroke="#2a3d55" stroke-width="2"/><line x1="180" y1="27" x2="180" y2="219" stroke="#2a3d55" stroke-width="2"/><circle cx="244" cy="171" r="4" fill="#82dfbd" stroke="none" stroke-width="2"/><text x="252" y="162" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">像素 (480,120)</text><text x="66" y="56" fill="#83baff" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">640 × 480</text><text x="180" y="248" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">NDC (0.5,−0.5) → 视口；左下原点</text></svg>