<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>环境项 ka = 0.7</title><desc>球体与光源不变，给所有表面叠加常量 0.7；背光区域也被填亮。</desc><rect width="360" height="264" fill="#0b1421"/><image x="104" y="49" width="152" height="152" href="data:image/png;base64,"/><text x="180" y="29" fill="#9bb0ca" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">同一球体、同一材质</text><text x="180" y="216" fill="#9bb0ca" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">仅增加统一常量</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">过大常量掩盖了形状明暗</text></svg>