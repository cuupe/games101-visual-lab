<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>多边形剖分</title><desc>复杂轮廓可以拆成若干三角形分别处理。</desc><rect width="360" height="264" fill="#0b1421"/><polygon points="60,210 280,210 280,130 165,130 165,55 60,55" fill="#173a38" stroke="#82dfbd" stroke-width="2" stroke-linejoin="round"/><line x1="60" y1="210" x2="165" y2="130" stroke="#b9a2ff" stroke-width="2"/><line x1="60" y1="210" x2="165" y2="55" stroke="#b9a2ff" stroke-width="2"/><line x1="165" y1="130" x2="280" y2="210" stroke="#b9a2ff" stroke-width="2"/><text x="180" y="248" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">非凸多边形也可三角剖分</text></svg>