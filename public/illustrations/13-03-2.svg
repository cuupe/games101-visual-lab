<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>方向翻倍，参数减半</title><desc>图形和交点不变，只有射线参数的刻度改变。</desc><rect width="360" height="264" fill="#0b1421"/><circle cx="208" cy="132" r="55" fill="#142235" stroke="#82dfbd" stroke-width="2"/><line x1="44" y1="132" x2="322" y2="132" stroke="#83baff" stroke-width="2.7"/><polygon points="322,132 313.94,136 313.94,128" fill="#83baff" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="44" y1="163" x2="134" y2="163" stroke="#b9a2ff" stroke-width="4"/><polygon points="134,163 125.94,167 125.94,159" fill="#b9a2ff" stroke="none" stroke-width="2" stroke-linejoin="round"/><circle cx="153" cy="132" r="5" fill="#f3b47f" stroke="none" stroke-width="2"/><circle cx="263" cy="132" r="5" fill="#f3b47f" stroke="none" stroke-width="2"/><text x="126" y="95" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">t=1</text><text x="243" y="95" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">t=2</text><text x="49" y="197" fill="#b9a2ff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">|d|=2</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">最近距离仍是 1 × 2 = 2</text></svg>