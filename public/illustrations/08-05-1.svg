<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>顶点阶段：坐标变换</title><desc>顶点输入经过 MVP，得到裁剪坐标；透视除法与视口变换后才落到屏幕。</desc><rect width="360" height="264" fill="#0b1421"/><polygon points="85,66 124,85.5 85,105 46,85.5" fill="#b9a2ff" stroke="#0b1421" stroke-width="2" stroke-linejoin="round"/><polygon points="85,105 124,85.5 124,124.5 85,144" fill="#82dfbd" stroke="#0b1421" stroke-width="2" stroke-linejoin="round"/><polygon points="46,85.5 85,105 85,144 46,124.5" fill="#83baff" stroke="#0b1421" stroke-width="2" stroke-linejoin="round"/><line x1="132" y1="106" x2="176" y2="106" stroke="#f3b47f" stroke-width="2.7"/><polygon points="176,106 167.94,110 167.94,102" fill="#f3b47f" stroke="none" stroke-width="2" stroke-linejoin="round"/><polygon points="205,184 327,184 246,69" fill="#82dfbd44" stroke="#82dfbd" stroke-width="2" stroke-linejoin="round"/><text x="35" y="184" fill="#b9a2ff" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">模型坐标</text><text x="178" y="214" fill="#82dfbd" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">屏幕顶点</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">顶点着色器不直接决定所有像素</text></svg>