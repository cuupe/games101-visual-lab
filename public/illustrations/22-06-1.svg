<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>力作用在质心</title><desc>矩形刚体质心在原点，向上 10 N 力作用于中心，力臂为零，力矩为零。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="80" y="91" width="200" height="85" rx="0" fill="#142235" stroke="#83baff"/><circle cx="180" cy="134" r="6" fill="#f3b47f" stroke="none" stroke-width="2"/><line x1="180" y1="128" x2="180" y2="54" stroke="#82dfbd" stroke-width="4"/><polygon points="180,54 184,62.06 176,62.06" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="202" y="68" fill="#82dfbd" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">F=10 N</text><text x="20" y="25" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">质心受力</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">r=0 → τ=0</text></svg>