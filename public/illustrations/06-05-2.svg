<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>像素区域有部分覆盖</title><desc>对图中的直角三角形精确求面积，137×180/2 除以 180²。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="75" y="40" width="180" height="180" rx="0" fill="#142235" stroke="#9bb0ca"/><polygon points="75,220 75,40 212,220" fill="#82dfbd99" stroke="#82dfbd" stroke-width="2" stroke-linejoin="round"/><text x="270" y="92" fill="#9bb0ca" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">高 180</text><text x="99" y="33" fill="#9bb0ca" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">底 137</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">真实覆盖率 = 137/360 ≈ 0.381</text></svg>