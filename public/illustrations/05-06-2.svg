<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>60% 覆盖</title><desc>中心落在内部，单次采样给 1，但真实覆盖只为 60%。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="85" y="43" width="190" height="166" rx="0" fill="#142235" stroke="#2a3d55"/><rect x="85" y="43" width="114" height="166" rx="0" fill="#357963" stroke="none"/><line x1="199" y1="43" x2="199" y2="209" stroke="#82dfbd" stroke-width="3"/><circle cx="180" cy="126" r="7" fill="#83baff" stroke="none" stroke-width="2"/><text x="180" y="27" fill="#e0eaf7" font-size="18" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">一个像素的面积</text><text x="180" y="228" fill="#e0eaf7" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">中心样本 = 1</text><text x="180" y="248" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">真实覆盖率 = 60%</text></svg>