<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>仿射变换保留同一参数</title><desc>对象空间方向也按线性变换改变；若额外归一化，必须换算 t。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="28" y="56" width="135" height="144" rx="6" fill="#142235" stroke="#83baff"/><rect x="196" y="56" width="137" height="144" rx="6" fill="#142235" stroke="#b9a2ff"/><line x1="41" y1="130" x2="146" y2="130" stroke="#83baff" stroke-width="2.7"/><polygon points="146,130 137.94,134 137.94,126" fill="#83baff" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="212" y1="130" x2="318" y2="130" stroke="#b9a2ff" stroke-width="2.7"/><polygon points="318,130 309.94,134 309.94,126" fill="#b9a2ff" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="47" y="83" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">世界空间</text><text x="212" y="83" fill="#b9a2ff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">对象空间</text><text x="44" y="169" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">o+t d</text><text x="209" y="169" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">o′+t d′</text><line x1="169" y1="126" x2="191" y2="126" stroke="#82dfbd" stroke-width="2.7"/><polygon points="191,126 182.94,130 182.94,122" fill="#82dfbd" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">相同 t；方向长度未必相同</text></svg>