<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>RGB 发光通道</title><desc>示意的 RGB 子像素共同决定人眼看到的像素颜色。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="55" y="70" width="15" height="113" rx="0" fill="#ff8c9f" stroke="none"/><rect x="73" y="70" width="15" height="113" rx="0" fill="#82dfbd" stroke="none"/><rect x="91" y="70" width="15" height="113" rx="0" fill="#83baff" stroke="none"/><rect x="118" y="70" width="15" height="113" rx="0" fill="#ff8c9f" stroke="none"/><rect x="136" y="70" width="15" height="113" rx="0" fill="#82dfbd" stroke="none"/><rect x="154" y="70" width="15" height="113" rx="0" fill="#83baff" stroke="none"/><rect x="181" y="70" width="15" height="113" rx="0" fill="#ff8c9f" stroke="none"/><rect x="199" y="70" width="15" height="113" rx="0" fill="#82dfbd" stroke="none"/><rect x="217" y="70" width="15" height="113" rx="0" fill="#83baff" stroke="none"/><rect x="244" y="70" width="15" height="113" rx="0" fill="#ff8c9f" stroke="none"/><rect x="262" y="70" width="15" height="113" rx="0" fill="#82dfbd" stroke="none"/><rect x="280" y="70" width="15" height="113" rx="0" fill="#83baff" stroke="none"/><text x="180" y="42" fill="#e0eaf7" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">一个像素可由 RGB 子像素组成</text><text x="180" y="248" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">颜色由各通道的发光量共同决定</text></svg>