<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>偏移太大：真实阴影丢失</title><desc>实际遮挡点 z=0.415，本应比 D=0.400 更远；偏移 0.020 却使阈值变为 0.420。</desc><rect width="360" height="264" fill="#0b1421"/><rect x="43" y="65" width="275" height="47" rx="0" fill="#142235" stroke="#f3b47f"/><text x="180" y="94" fill="#f3b47f" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">0.415 ≤ 0.400 + 0.020</text><rect x="78" y="130" width="74" height="65" rx="0" fill="#82dfbd" stroke="none"/><rect x="158" y="196" width="131" height="15" rx="0" fill="#b9a2ff88" stroke="none"/><line x1="40" y1="211" x2="320" y2="211" stroke="#9bb0ca" stroke-width="2"/><text x="180" y="35" fill="#f3b47f" font-size="18" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">bias = 0.020</text><text x="180" y="246" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">真实遮挡被误判为受光：悬浮感</text></svg>