<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>单位方向的球求交</title><desc>球心在 x=0、半径 1；原点 x=−3，最近交点距离为 2。</desc><rect width="360" height="264" fill="#0b1421"/><circle cx="208" cy="132" r="55" fill="#142235" stroke="#82dfbd" stroke-width="2"/><line x1="44" y1="132" x2="322" y2="132" stroke="#83baff" stroke-width="2.7"/><polygon points="322,132 313.94,136 313.94,128" fill="#83baff" stroke="none" stroke-width="2" stroke-linejoin="round"/><circle cx="43" cy="132" r="4" fill="#83baff" stroke="none" stroke-width="2"/><text x="50" y="124" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">o=−3</text><circle cx="153" cy="132" r="5" fill="#f3b47f" stroke="none" stroke-width="2"/><circle cx="263" cy="132" r="5" fill="#f3b47f" stroke="none" stroke-width="2"/><text x="126" y="95" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">t=2</text><text x="243" y="95" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">t=4</text><text x="157" y="213" fill="#e0eaf7" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">|d|=1</text><text x="180" y="249" fill="#82dfbd" font-size="17" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">距离 = t · |d| = 2</text></svg>