<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img"><title>孔径减半</title><desc>像点和传感器保持不变，孔径直径从 10 减为 5 mm；会聚位置不移动。</desc><rect width="360" height="264" fill="#0b1421"/><text x="20" y="26" fill="#e0eaf7" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">D=5，vₒ=60，v𝒻=50 mm</text><line x1="32" y1="132" x2="325" y2="132" stroke="#9bb0ca" stroke-width="1" stroke-dasharray="4 4"/><line x1="60" y1="117" x2="60" y2="147" stroke="#83baff" stroke-width="5"/><line x1="60" y1="117" x2="222" y2="132" stroke="#f3b47f" stroke-width="2"/><line x1="60" y1="147" x2="222" y2="132" stroke="#f3b47f" stroke-width="2"/><line x1="195" y1="48" x2="195" y2="214" stroke="#b9a2ff" stroke-width="3"/><line x1="195" y1="129.5" x2="195" y2="134.5" stroke="#82dfbd" stroke-width="7"/><circle cx="222" cy="132" r="4" fill="#f3b47f" stroke="none" stroke-width="2"/><text x="26" y="63" fill="#83baff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">孔径</text><text x="171" y="44" fill="#b9a2ff" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">传感器</text><text x="200" y="218" fill="#f3b47f" font-size="16" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">像点</text><text x="180" y="247" fill="#82dfbd" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">c≈0.83 mm，像距不变</text></svg>